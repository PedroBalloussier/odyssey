  en:{short:"Mongols", date:"1271 – 1368", title:"The Mongol Yuan dynasty",
    story:["In the 13th century the Mongols, united by Genghis Khan, built the largest land empire in history. His grandson Kublai Khan completed the conquest of China in 1279 and founded the Yuan dynasty.",
           "For the first time all of China was ruled by outsiders. The empire linked China to Persia and Europe; merchants, missionaries and craftsmen travelled its roads, among them, according to his famous book, the Venetian Marco Polo."],
    lname:"Khanbaliq, the Khan's city", ltext:"Kublai built a new capital, Khanbaliq or Dadu, on the site of today's Beijing. Its grid plan, and the Grand Canal extended to supply it, shaped the city that would be China's capital for most of the next 700 years.",
    facts:["The Mongol relay system, the yam, had thousands of stations with fresh horses across Asia.",
           "Kublai's invasions of Japan in 1274 and 1281 failed, partly because of storms the Japanese called 'kamikaze', the divine wind."]},
  pt:{short:"Mongóis", date:"1271 – 1368", title:"A dinastia mongol Yuan",
    story:["No século XIII, os mongóis, unidos por Gengis Khan, construíram o maior império terrestre da história. Seu neto Kublai Khan completou a conquista da China em 1279 e fundou a dinastia Yuan.",
           "Pela primeira vez, toda a China foi governada por estrangeiros. O império ligava a China à Pérsia e à Europa; mercadores, missionários e artesãos percorriam suas estradas, entre eles, segundo seu famoso livro, o veneziano Marco Polo."],
    lname:"Khanbaliq, a cidade do Khan", ltext:"Kublai construiu uma nova capital, Khanbaliq ou Dadu, onde hoje fica Pequim. Seu traçado em grade, e o Grande Canal ampliado para abastecê-la, moldaram a cidade que seria a capital da China durante a maior parte dos 700 anos seguintes.",
    facts:["O sistema de revezamento mongol, o yam, tinha milhares de postos com cavalos descansados por toda a Ásia.",
           "As invasões do Japão por Kublai, em 1274 e 1281, fracassaram em parte por causa de tempestades que os japoneses chamaram de 'kamikaze', o vento divino."]}

  en:{short:"Qing & Diaspora", date:"1644 – 1912", title:"The Qing, the Opium Wars and the diaspora",
    story:["In 1644 the Manchus from the north-east took Beijing and founded the Qing, China's last dynasty. Under the Qing the empire reached its largest size, and the population grew to over 400 million by the mid-1800s.",
           "In the 19th century Britain went to war to keep selling opium to China. After the First Opium War (1839–42), China ceded Hong Kong and opened its ports. Poverty, wars and the huge Taiping Rebellion pushed millions to emigrate, mostly from Guangdong and Fujian, to South-East Asia, and also to the Americas, where they built railways and worked in mines and plantations."],
    lname:"Canton (Guangzhou)", ltext:"From 1757 to 1842 Canton was the only port where Western merchants could trade with China, through licensed Chinese merchants known as the Cohong. Tea, silk and porcelain went out; silver, and then opium, came in.",
    facts:["Under the Qing, men had to wear the Manchu hairstyle, the long braided 'queue', as a sign of loyalty.",
           "Today tens of millions of people of Chinese descent live outside China, above all in South-East Asia."]},
  pt:{short:"Qing e Diáspora", date:"1644 – 1912", title:"Os Qing, as Guerras do Ópio e a diáspora",
    story:["Em 1644, os manchus do nordeste tomaram Pequim e fundaram os Qing, a última dinastia da China. Sob os Qing, o império atingiu seu maior tamanho, e a população passou de 400 milhões em meados do século XIX.",
           "No século XIX, o Reino Unido foi à guerra para continuar vendendo ópio à China. Depois da Primeira Guerra do Ópio (1839–42), a China cedeu Hong Kong e abriu seus portos. A pobreza, as guerras e a enorme Rebelião Taiping levaram milhões a emigrar, sobretudo de Guangdong e Fujian, para o Sudeste Asiático e também para as Américas, onde construíram ferrovias e trabalharam em minas e plantações."],
    lname:"Cantão (Guangzhou)", ltext:"De 1757 a 1842, Cantão foi o único porto onde mercadores ocidentais podiam comerciar com a China, por meio de mercadores chineses licenciados, o Cohong. Saíam chá, seda e porcelana; entravam prata e, depois, ópio.",

function eraTransform(i){

  k = Math.min(k, W / (7/360*WORLD_W));

  const cx = ins.l + aw/2, cy = ins.t + ah/2;

  const out = [], steps = 18;
  for (let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
    for (let s=(i===0?0:1); s<=steps; s++){
      const u=s/steps, u2=u*u, u3=u2*u;
      out.push([0,1].map(j => 0.5*((2*p1[j]) + (-p0[j]+p2[j])*u + (2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*u2 + (-p0[j]+3*p1[j]-3*p2[j]+p3[j])*u3)));
    }
  }
  const cum=[0];
  for (let i=1;i<out.length;i++) cum.push(cum[i-1] + Math.hypot(out[i][0]-out[i-1][0], out[i][1]-out[i-1][1]));
  return {pts:out, cum, len:cum[cum.length-1]};
}
function partial(r, f){
  if (f <= 0) return [];
  const target = r.len * Math.min(f,1);
  const res = [r.pts[0]];
  for (let i=1;i<r.pts.length;i++){
    if (r.cum[i] <= target){ res.push(r.pts[i]); continue; }
    const seg = r.cum[i]-r.cum[i-1], u = seg ? (target-r.cum[i-1])/seg : 0;
    res.push([r.pts[i-1][0]+(r.pts[i][0]-r.pts[i-1][0])*u, r.pts[i-1][1]+(r.pts[i][1]-r.pts[i-1][1])*u]);
    break;
  }
  return res;
}
function pointAt(r, f){
  const target = r.len * Math.max(0, Math.min(1, f));
  let i = 1; while (i < r.pts.length-1 && r.cum[i] < target) i++;
  const seg = r.cum[i]-r.cum[i-1], u = seg ? (target-r.cum[i-1])/seg : 0;
  const a = r.pts[i-1], b = r.pts[i];
  return {p:[a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u], dx:b[0]-a[0]};
}
Object.values(COUNTRIES).forEach(cn => cn.eras.forEach(e => e.routes.forEach(r => r.s = sampleRoute(r.pts))));

/* =========================================================
   OVERLAY RENDERING (every frame)
   ========================================================= */
let cur = -1, eraStart = 0, playing = false;
const ERA_MS = 15000;
const line = d3.line();

function drawOverlay(now){
  if (cur < 0 || !C) return;
  const era = ERAS[cur];
  const el = now - eraStart;

  // decorations
  gDeco.selectAll("use.deco").data(landReady ? DECOS : []).join("use").attr("class","deco")
    .attr("href", d => "#"+d.id).attr("width", d => d.w).attr("height", d => d.h)
    .each(function(d,i){
      const q = S(P(d.c)), bob = Math.sin(now/1300 + i) * 2.2;
      const vis = q[0] > -120 && q[0] < W+120 && q[1] > -60 && q[1] < H+60;
      d3.select(this).attr("x", q[0]-d.w/2).attr("y", q[1]-d.h/2+bob).attr("display", vis ? null : "none");
    });

  // quake rings
  const rings = era.quake ? [0,1,2] : [];
  const qp = era.quake ? S(P(era.quake)) : [0,0];
  gOver.selectAll("circle.quake").data(rings).join("circle").attr("class","quake")
    .attr("cx",qp[0]).attr("cy",qp[1])
    .each(function(d){
      const ph = ((el/2600) + d/3) % 1;
      d3.select(this).attr("r", 6 + ph*Math.min(W,H)*0.55).attr("stroke-width", 2.5*(1-ph)+.3).attr("opacity", el<900?0:(1-ph)*.8);
    });

  // routes + travellers
  const rd = era.routes.map((r,i) => {
    const start = 1500 + i*650, f = Math.max(0, Math.min(1, (el - start) / 2600));
    return {r, f, ease:d3.easeCubicInOut(f), i, done: start + 2600};
  });
  const rg = gOver.selectAll("g.rt").data(rd, d => C.id+cur+"-"+d.i).join(enter => {
    const g = enter.append("g").attr("class","rt");
    g.append("path").attr("class","route halo");
    g.append("path").attr("class","route main");
    g.append("path").attr("class","head");
    g.append("text").attr("class","rlabel");
    const tg = g.append("g").attr("class","trav");
    tg.append("use");
    return g;
  });
  rg.each(function(d){
    const k = KINDS[d.r.kind];
    const pts = partial(d.r.s, d.ease).map(S);
    const g = d3.select(this);
    g.select(".halo").attr("d", pts.length>1 ? line(pts) : null).attr("stroke","rgba(245,236,213,.75)").attr("stroke-width",k.w+3);
    g.select(".main").attr("d", pts.length>1 ? line(pts) : null).attr("stroke",k.color).attr("stroke-width",k.w).attr("stroke-dasharray",k.dash);
    if (pts.length > 1){
      const a = pts[pts.length-2], b = pts[pts.length-1];
      const ang = Math.atan2(b[1]-a[1], b[0]-a[0]), s = 8 + k.w;
      const p1=[b[0]+Math.cos(ang)*s*.4, b[1]+Math.sin(ang)*s*.4];
      const p2=[b[0]+Math.cos(ang+2.6)*s, b[1]+Math.sin(ang+2.6)*s];
      const p3=[b[0]+Math.cos(ang-2.6)*s, b[1]+Math.sin(ang-2.6)*s];
      g.select(".head").attr("d",`M${p1}L${p2}L${p3}Z`).attr("fill",k.color).attr("stroke","rgba(245,236,213,.9)").attr("stroke-width",1);
    } else g.select(".head").attr("d",null);
    const lab = g.select(".rlabel");
    if (d.r.label && d.f >= 1){
      const m = S(d.r.s.pts[Math.floor(d.r.s.pts.length*(d.r.lf||0.45))]);
      lab.attr("text-anchor", d.r.la||"start").attr("x",m[0]+(d.r.la==="end"?-8:8)).attr("y",m[1]-8)
        .text(t(d.r.label)).attr("opacity", Math.min(1,(el-d.done)/500));
    } else lab.text("");
    // traveller
    const tv = TRAV[d.r.tv || k.tv] || TRAV.walker;
    let pos = null, op = 0;
    if (d.f > 0 && d.f < 1){ const q = pointAt(d.r.s, d.ease); pos = q; op = 1; }
    else if (d.f >= 1){
      const per = Math.max(5000, Math.min(11000, d.r.s.len * 18));
      const u = ((el - d.done) % per) / per;
      pos = pointAt(d.r.s, u); op = Math.max(0, Math.min(1, u*7, (1-u)*7));
    }
    const tg = g.select(".trav");
    if (pos){
      const q = S(pos.p), flip = pos.dx < 0 ? -1 : 1;
      tg.attr("transform", `translate(${q[0]},${q[1]}) scale(${flip},1)`).attr("opacity", op);
      tg.select("use").attr("href","#"+tv.id).attr("x",-tv.w/2).attr("y",-tv.h+3).attr("width",tv.w).attr("height",tv.h);
    } else tg.attr("opacity",0);
  });

  // places
  const pop = Math.max(0, Math.min(1, (el-1100)/700));
  const sp = S(P(era.spot.c));
  const pg = gOver.selectAll("g.place").data(era.places, (d,i) => C.id+cur+"-"+i).join(enter => {
    const g = enter.append("g").attr("class","place");
    g.append("circle").attr("r",3.6); g.append("text"); g.append("title");
    return g;
  });
  pg.each(function(d){
    const q = S(P(d.c)), g = d3.select(this), right = q[0] > W-150;
    const near = Math.abs(q[1]-sp[1]) < 26 && Math.abs(q[0]-sp[0]) < 160;
    g.attr("transform", `translate(${q})`).attr("opacity", pop);
    g.select("text").text(t(d.n)).attr("text-anchor", right ? "end" : "start").attr("x", right ? -7 : 7)
      .attr("y", near ? (q[1]>=sp[1] ? 17 : -9) : 4);
    g.select("title").text(d.t ? `${t(d.n)}: ${t(d.t)}` : t(d.n));
  });

  // spotlight marker
  let lg = gOver.select("g.spot");
  if (lg.empty()){
    lg = gOver.append("g").attr("class","spot");
    lg.append("circle").attr("class","pulse").attr("fill","none").attr("stroke","#8f2d1f");
    lg.append("circle").attr("r",5.5).attr("fill","#8f2d1f").attr("stroke","#f5ecd5").attr("stroke-width",2);
    lg.append("text").attr("y",-8);
  }
  lg.raise().attr("transform",`translate(${sp})`);
  const ph = (now/1800)%1;
  lg.select(".pulse").attr("r",6+ph*16).attr("opacity",(1-ph)*.7).attr("stroke-width",1.5);
  const rightSide = sp[0] > W-170;
  lg.select("text").text(t(era.spot.n)).attr("text-anchor", rightSide ? "end" : "start").attr("x", rightSide ? -10 : 10);

  updateFill(playing ? Math.min(1, el/ERA_MS) : 0);
  if (playing && el > ERA_MS){
    if (cur < ERAS.length-1) go(cur+1);
    else { setPlaying(false); openQuiz(); }
  }
}
d3.timer(() => drawOverlay(performance.now()));

function engr(name, w, h, isStatic){
  return `<svg class="engr${isStatic?" static":""}" viewBox="0 0 ${w} ${h}">${A.V[name] ? A.V[name]() : ""}</svg>`;
}
function fmtNum(v){ const pt = lang === "pt"; if (v >= 1e6) return (v/1e6).toFixed(2).replace(".", pt ? "," : ".") + (pt ? " mi" : " M"); if (v >= 1e3) return Math.round(v/1e3) + (pt ? " mil" : "k"); return String(v); }
function fmtPct(v){ return (lang === "pt" ? String(v).replace(".", ",") : String(v)) + "%"; }
const ICON_ORIG = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>`;
function originsHTML(o){
  if (!o) return "";
  let body;
  if (o.rank) body = `<ol class="orank">${o.items.map(it => `<li><b>${t(it.n)}</b>${it.extra ? ` <span>&mdash; ${t(it.extra)}</span>` : ""}</li>`).join("")}</ol>`;
  else {
    const max = Math.max(...o.items.map(i => i.v));
    body = o.items.map(it => `<div class="orow"><span>${t(it.n)}${it.c ? `<small>${t(it.c)}</small>` : ""}</span><div class="otrack"><div class="obar" style="width:${Math.max(1.5, it.v/max*100).toFixed(1)}%"></div></div><span class="ov" title="${it.v.toLocaleString(lang === "pt" ? "pt-BR" : "en")}">${o.pct ? fmtPct(it.p) : fmtNum(it.v)}</span></div>`).join("");
  }
  return `<div class="box orig"><h3>${ICON_ORIG}${t(o.title).toUpperCase()}</h3>${body}<div class="note">${t(o.note)}</div></div>`;
}
function linesHTML(L){
  if (!L) return "";
  return `<div class="lines"><div class="ltitle">${t(L.title).toUpperCase()}</div>${L.rows.map(r => `<div class="lrow"><span>${t(r.n)}</span><div class="dna-bar sm">${r.parts.map(q => `<div style="width:${q.v}%;background:${q.c}"></div>`).join("")}</div><div class="lleg">${r.parts.map(q => `<span><i style="background:${q.c}"></i>${t(q.k)} ${fmtPct(q.v)}</span>`).join("")}</div></div>`).join("")}<div class="note">${t(L.note)}</div><div class="note">${t(L.sub)}</div></div>`;
}

const track = document.getElementById("track");
function buildTicks(){
  track.querySelectorAll(".tick").forEach(b => b.remove());
  ERAS.forEach((e,i) => {
    const b = document.createElement("button");
    b.className = "tick"; b.dataset.i = i;
    b.innerHTML = `<span class="dot"></span><span class="lab"></span>`;
    track.appendChild(b);
  });
  labelTicks(); layoutTicks();
}
function labelTicks(){ track.querySelectorAll(".tick").forEach(b => { const i=+b.dataset.i; b.querySelector(".lab").textContent = E(i).short; b.setAttribute("aria-label", `${U("chapterLower")} ${i+1}: ${E(i).short}`); }); }
function tickX(i){ const w = track.clientWidth - 24; return 12 + w * i/Math.max(1,ERAS.length-1); }
function layoutTicks(){ track.querySelectorAll(".tick").forEach(b => b.style.left = tickX(+b.dataset.i)+"px"); updateFill(0); }
function updateTicks(){ track.querySelectorAll(".tick").forEach(b => { const i=+b.dataset.i; b.classList.toggle("on", i===cur); b.classList.toggle("past", i<cur); }); }
function updateFill(p){
  const a = tickX(Math.max(cur,0)), b = cur < ERAS.length-1 ? tickX(cur+1) : a;
  document.getElementById("fill").style.width = Math.max(0, a - 12 + (b-a)*p) + "px";
}
function idxFromX(x){
  const r = track.getBoundingClientRect(), w = r.width-24;
  return Math.round(Math.max(0,Math.min(1,(x - r.left - 12)/w)) * (ERAS.length-1));
}
let dragging = false;
track.addEventListener("pointerdown", e => { dragging = true; track.setPointerCapture(e.pointerId); const i = idxFromX(e.clientX); if (i!==cur) go(i); });
track.addEventListener("pointermove", e => { if (!dragging) return; const i = idxFromX(e.clientX); if (i!==cur) go(i); });
track.addEventListener("pointerup", () => dragging = false);
window.addEventListener("resize", layoutTicks);

let qi = 0, answers = [], quizDone = false;
function syncModal(){ document.body.classList.toggle("modal-open", !qo.classList.contains("hidden") || !ro.classList.contains("hidden")); }
function openQuiz(){ if (!C) return; closeRefs(); setPlaying(false); qi = 0; answers = []; quizDone = false; qo.classList.remove("hidden"); syncModal(); renderQ(); }
function closeQuiz(){ qo.classList.add("hidden"); syncModal(); }
qo.addEventListener("click", e => { if (e.target === qo) closeQuiz(); });
document.getElementById("quizBtn").onclick = openQuiz;
function prog(){ return `<div class="qprog">${C.quiz.map((q,i)=>`<i class="${answers[i]==null?"":answers[i]===q.a?"ok":"no"}"></i>`).join("")}</div>`; }
function closeBtn(fn){ return `<button class="close" aria-label="${U("close")}" onclick="${fn}()">&times;</button>`; }
function renderQ(){
  const Q = C.quiz[qi], q = Q[lang], ans = answers[qi];
  qb.innerHTML = `${closeBtn("closeQuiz")}
    <div class="qn">${t(C.name).toUpperCase()} · ${U("question")} ${qi+1} ${U("of")} ${C.quiz.length}</div>
    <h3>${q.q}</h3>
    <div class="opts">${q.o.map((o,j)=>{
      const cls = ans==null ? "" : (j===Q.a ? " right" : (j===ans ? " wrong" : ""));
      return `<button class="opt${cls}" data-j="${j}" ${ans!=null?"disabled":""}>${o}</button>`;
    }).join("")}</div>
    <div class="feedback">${ans==null ? "" : `<b>${U(ans===Q.a?"correct":"wrong")}</b> ${q.e}`}</div>
    <div class="qfoot">${prog()}<button class="btn primary" id="qnext" style="visibility:${ans==null?"hidden":"visible"}">${U(qi<C.quiz.length-1?"nextQ":"seeScore")}</button></div>`;
  qb.querySelectorAll(".opt").forEach(b => b.onclick = () => { answers[qi] = +b.dataset.j; renderQ(); document.getElementById("qnext").focus(); });
  document.getElementById("qnext").onclick = () => { qi++; if (qi < C.quiz.length) renderQ(); else { quizDone = true; renderScore(); } };
}
function renderScore(){
  const s = C.quiz.filter((q,i) => answers[i] === q.a).length, msgs = U("score");
  const msg = s>=9 ? msgs[0] : s>=6 ? msgs[1] : s>=3 ? msgs[2] : msgs[3];
  qb.innerHTML = `${closeBtn("closeQuiz")}
    <div class="qn">${t(C.name).toUpperCase()} · ${U("result")}</div>
    <div class="score">${s} / ${C.quiz.length}</div>
    <h3>${msg}</h3>${prog()}
    <div class="qfoot"><button class="btn" onclick="closeQuiz()">${U("back")}</button><button class="btn primary" onclick="openQuiz()">${U("again")}</button></div>`;
}

/* =========================================================
   SOURCES
   ========================================================= */
const ro = document.getElementById("refsOverlay"), rb = document.getElementById("refsBox");
let refsCountry = null, refsFocus = null;
function openRefs(focus){ closeQuiz(); refsCountry = (C || COUNTRIES.portugal).id; refsFocus = (typeof focus === "number") ? focus : null; ro.classList.remove("hidden"); syncModal(); renderRefs(); }
function closeRefs(){ ro.classList.add("hidden"); syncModal(); }
ro.addEventListener("click", e => { if (e.target === ro) closeRefs(); });
document.querySelectorAll("[data-open=refs]").forEach(b => b.onclick = () => openRefs());
function refItem(r){ return `<li><a href="${r.u}" target="_blank" rel="noopener noreferrer">${t(r.t)}</a><small>${r.s}</small></li>`; }
function renderRefs(){
  const cn = COUNTRIES[refsCountry], refs = cn.refs || [];
  const L = lang === "pt" ? "pt" : "en";
  let body = "";
  cn.eras.forEach((e,i) => {
    const list = refs.filter(r => r.ch.includes(i));
    body += `<h4 id="ref-ch-${i}">${U("chapter")} ${romanize(i)} · ${e[L].short.toUpperCase()}</h4>` +
      (list.length ? `<ol>${list.map(refItem).join("")}</ol>` : `<div class="rnote" style="margin:0">${U("refsNone")}</div>`);
  });
  const dna = refs.filter(r => r.ch.includes("dna"));
  if (dna.length) body += `<h4>${U("refsDna").toUpperCase()}</h4><ol>${dna.map(refItem).join("")}</ol>`;
  if (MUSIC.credit) body += `<h4>${U("musicCredit").toUpperCase()}</h4><ol>${refItem(MUSIC.credit)}</ol>`;
  body += `<p class="rnote">${U("refsNote")}</p>`;
  rb.innerHTML = `${closeBtn("closeRefs")}
    <div class="rhead"><div class="qn">${U("refsKicker")}</div><h3>${U("refsTitle")}</h3>
      <div class="tabs">${ORDER.map(id => `<button data-c="${id}" class="${id===refsCountry?"on":""}">${t(COUNTRIES[id].name)}</button>`).join("")}</div></div>
    <div class="rbody" id="rbody">${body}</div>`;
  rb.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { refsCountry = b.dataset.c; refsFocus = null; renderRefs(); });
  if (refsFocus != null){ const h = document.getElementById("ref-ch-"+refsFocus); if (h) document.getElementById("rbody").scrollTop = h.offsetTop - 10; }
}

/* =========================================================
   FULL SCREEN
   ========================================================= */
const fsBtn = document.getElementById("fsBtn");
const FS_IN = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`;
const FS_OUT = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>`;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function fsSync(){ const on = !!fsEl(); fsBtn.innerHTML = on ? FS_OUT : FS_IN; const v = U(on ? "exitFs" : "fullscreen"); fsBtn.title = v; fsBtn.setAttribute("aria-label", v); }
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.hidden = true;
fsBtn.onclick = () => {
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else { const el = document.documentElement; const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => {}); }
};
["fullscreenchange","webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, () => { fsSync(); setTimeout(() => { resize(); layoutTicks(); }, 120); }));


/* =========================================================
   BACKGROUND MUSIC  (file "music.mp3" next to index.html)
   ========================================================= */
const MUSIC = { src:"music.mp3", credit:null /* e.g. {t:"Title, Artist", s:"Licence", u:"https://..."} */ };
const ICON_SND = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>`;
const ICON_MUTE = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>`;
const mus = { el:new Audio(), on: store.get("odyssey-music") !== "off", vol: 0.10, ok:true, unlocked:false, fade:null };
{ const v = parseFloat(store.get("odyssey-volume")); if (!isNaN(v) && v >= 0 && v <= 1) mus.vol = v; }
mus.el.src = MUSIC.src; mus.el.loop = true; mus.el.preload = "auto"; mus.el.volume = 0;
mus.el.addEventListener("error", () => { mus.ok = false; document.querySelectorAll("[data-music]").forEach(m => m.classList.add("off-file")); });
function musFade(to, ms, then){
  clearInterval(mus.fade); const a = mus.el, from = a.volume, n = Math.max(1, Math.round(ms/40)); let k = 0;
  mus.fade = setInterval(() => { k++; a.volume = Math.min(1, Math.max(0, from + (to-from)*k/n)); if (k >= n){ clearInterval(mus.fade); if (then) then(); } }, 40);
}
function musPlay(){ if (!mus.ok || !mus.on || !mus.unlocked) return; const p = mus.el.play(); if (p && p.catch) p.catch(() => {}); musFade(mus.vol, 1500); }
function musStop(){ musFade(0, 600, () => mus.el.pause()); }
function musSync(){
  document.querySelectorAll("[data-music]").forEach(m => {
    const b = m.querySelector(".mbtn"); if (!b) return;
    b.innerHTML = mus.on ? ICON_SND : ICON_MUTE; const v = U("music"); b.title = v; b.setAttribute("aria-label", v);
    m.querySelector(".mlab").textContent = U(mus.on ? "musicOn" : "musicOff");
    const sw = m.querySelector(".sw"); sw.setAttribute("aria-checked", mus.on); sw.setAttribute("aria-label", U("music"));
    m.querySelector(".vlab").textContent = U("volume");
    const r = m.querySelector("input"); r.value = Math.round(mus.vol*100); r.setAttribute("aria-label", U("volume"));
    m.querySelector(".mval").textContent = Math.round(mus.vol*100) + "%";
  });
}
document.querySelectorAll("[data-music]").forEach(m => {
  m.innerHTML = `<button class="btn ico mbtn" aria-haspopup="true" aria-expanded="false"></button>
    <div class="mpop" hidden>
      <div class="mrow"><span class="mlab"></span><button class="sw" role="switch"></button></div>
      <div class="mrow"><span class="mlab vlab"></span><span class="mval"></span></div>
      <input type="range" min="0" max="100" step="1">
    </div>`;
  const b = m.querySelector(".mbtn"), pop = m.querySelector(".mpop");
  b.onclick = e => { e.stopPropagation(); const open = pop.hidden; document.querySelectorAll(".music .mpop").forEach(x => x.hidden = true); document.querySelectorAll(".music .mbtn").forEach(x => x.setAttribute("aria-expanded", false)); pop.hidden = !open; b.setAttribute("aria-expanded", open); };
  pop.addEventListener("click", e => e.stopPropagation());
  m.querySelector(".sw").onclick = () => { mus.on = !mus.on; store.set("odyssey-music", mus.on ? "on" : "off"); mus.unlocked = true; mus.on ? musPlay() : musStop(); musSync(); };
  m.querySelector("input").oninput = e => { mus.vol = e.target.value/100; store.set("odyssey-volume", mus.vol); clearInterval(mus.fade); if (mus.on && mus.unlocked){ if (mus.el.paused) musPlay(); else mus.el.volume = mus.vol; } musSync(); };
});
document.addEventListener("click", () => { document.querySelectorAll(".music .mpop").forEach(x => x.hidden = true); document.querySelectorAll(".music .mbtn").forEach(x => x.setAttribute("aria-expanded", false)); });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".music .mpop").forEach(x => x.hidden = true); });
const musUnlock = () => { if (mus.unlocked) return; mus.unlocked = true; musPlay(); };
["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, musUnlock, { once:false, capture:true }));
document.addEventListener("visibilitychange", () => { if (document.hidden){ if (!mus.el.paused) mus.el.pause(); } else if (mus.on && mus.unlocked && mus.ok){ const p = mus.el.play(); if (p && p.catch) p.catch(() => {}); } });

/* =========================================================
   LANGUAGE APPLY
   ========================================================= */
function buildSelect(){ sel.innerHTML = ORDER.map(id => `<option value="${id}">${t(COUNTRIES[id].name)}</option>`).join(""); if (C) sel.value = C.id; }
function applyLang(){
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.title = U("appName") + (C ? " · " + t(C.name) : "");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = U(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { const v = U(el.dataset.i18nTitle); el.title = v; el.setAttribute("aria-label", v); });
  document.querySelectorAll(".lang button").forEach(b => { const on = b.dataset.lang === lang; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  buildSelect(); buildCards(); buildChips(); fillCountryPane(); fsSync(); musSync();
  if (C && track.querySelector(".tick")) labelTicks();
  setPlaying(playing);
  renderCartouche(); renderPanel(true); renderLegend();
  if (!qo.classList.contains("hidden")) quizDone ? renderScore() : renderQ();
  if (!ro.classList.contains("hidden")) renderRefs();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("odyssey-lang", lang); applyLang(); });

/* =========================================================
   LOAD
   ========================================================= */
document.getElementById("panorama").innerHTML = A.panorama(); prepEngr(document.getElementById("panorama"));
document.getElementById("windbox").innerHTML = A.wind(); { const w = document.querySelector("#windbox svg"); w.classList.add("engr","static"); prepEngr(w); }
if (!C) C = null;
const startId = C ? C.id : "portugal"; C = null;
setCountry(startId);
applyLang();
setPlaying(false);
showHome();
resize(); layoutTicks();
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json")
  .then(r => r.json())
  .then(topo => {
    const countries = topojson.feature(topo, topo.objects.countries).features.filter(f => f.id !== "010");
    const path = d3.geoPath(proj);
    gLand.append("path").datum(d3.geoGraticule10()).attr("class","grat").attr("d",path);
    gLand.selectAll("path.land").data(countries).join("path").attr("class","land").attr("d", path);
    gLand.selectAll("path.land").classed("hl", d => C && d.id === C.iso);
    gLand.selectAll("path.land.hl").raise();
    gWorld.append("use").attr("href","#landG").attr("x",-WORLD_W);
    gWorld.append("use").attr("href","#landG").attr("x",WORLD_W);
    landReady = true;
    document.getElementById("loading").remove();
    resize();
    flyToEra(Math.max(cur,0), 0);
  })
  .catch(() => {
    const l = document.getElementById("loading");
    l.removeAttribute("data-i18n"); l.innerHTML = U("mapErr");
  });
</script>
