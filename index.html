  en:{short:"Tang", date:"618 – 907", title:"Tang: a cosmopolitan empire",
    story:["Under the Tang dynasty, China was one of the largest and most open empires in the world. Its capital, Chang'an, may have had a million inhabitants, including Sogdian, Persian, Turkic, Korean and Japanese residents.",
           "Buddhism, which had arrived from India along the Silk Road, flourished. The monk Xuanzang walked to India and back (629–645) to collect Buddhist texts. By sea, Arab and Persian merchants settled in Guangzhou, bringing Islam to China."],
    lname:"Chang'an", ltext:"Chang'an, today's Xi'an, was laid out on a vast grid, with markets for local and foreign goods. The Giant Wild Goose Pagoda, built to store the scriptures Xuanzang brought back from India, still stands.",
    facts:["The Diamond Sutra found at Dunhuang, printed in 868, is the oldest dated printed book in the world.",
           "Tang poets such as Li Bai and Du Fu are still memorised by schoolchildren across China."]},
  pt:{short:"Tang", date:"618 – 907", title:"Tang: um império cosmopolita",
    story:["Sob a dinastia Tang, a China foi um dos maiores e mais abertos impérios do mundo. Sua capital, Chang'an, pode ter tido um milhão de habitantes, incluindo moradores sogdianos, persas, turcos, coreanos e japoneses.",
           "O budismo, que tinha chegado da Índia pela Rota da Seda, floresceu. O monge Xuanzang foi a pé até a Índia e voltou (629–645) para buscar textos budistas. Pelo mar, mercadores árabes e persas se instalaram em Cantão, levando o islã à China."],
    lname:"Chang'an", ltext:"Chang'an, a atual Xi'an, foi traçada numa enorme grade, com mercados para produtos locais e estrangeiros. O Grande Pagode do Ganso Selvagem, construído para guardar as escrituras que Xuanzang trouxe da Índia, continua de pé.",
    facts:["O Sutra do Diamante encontrado em Dunhuang, impresso em 868, é o livro impresso datado mais antigo do mundo.",
           "Poetas Tang como Li Bai e Du Fu ainda são decorados por estudantes de toda a China."]}

  en:{short:"Song", date:"960 – 1279", title:"Song: printing, compass and gunpowder",
    story:["The Song dynasty saw a commercial revolution. Paper money, movable-type printing, the magnetic compass for navigation and gunpowder weapons were all in use, and rice farming in the south fed a population that passed 100 million.",
           "In 1127 the Jurchen, invaders from the north, captured the capital Kaifeng. Huge numbers of people fled south, and the court moved to Hangzhou. China's centre of gravity shifted to the Yangtze and the south coast, where ports like Quanzhou traded across the Indian Ocean."],
    lname:"Hangzhou", ltext:"Hangzhou, on the shores of West Lake, became one of the largest cities in the world, with tea houses, theatres and night markets. Marco Polo later described it as the finest and noblest city in the world.",
    facts:["Bi Sheng invented movable type made of baked clay around 1040, four centuries before Gutenberg.",
           "The oldest known written formula for gunpowder appears in a Song military manual from 1044."]},
  pt:{short:"Song", date:"960 – 1279", title:"Song: imprensa, bússola e pólvora",
    story:["A dinastia Song viveu uma revolução comercial. Papel-moeda, impressão com tipos móveis, a bússola magnética para a navegação e armas de pólvora já eram usados, e o arroz do sul alimentava uma população que passou dos 100 milhões.",
           "Em 1127, os jurchéns, invasores do norte, tomaram a capital, Kaifeng. Multidões fugiram para o sul, e a corte se mudou para Hangzhou. O centro de gravidade da China passou para o Yangtzé e o litoral sul, onde portos como Quanzhou comerciavam por todo o Oceano Índico."],
    lname:"Hangzhou", ltext:"Hangzhou, às margens do Lago do Oeste, se tornou uma das maiores cidades do mundo, com casas de chá, teatros e mercados noturnos. Marco Polo depois a descreveu como a cidade mais bela e nobre do mundo.",
    facts:["Bi Sheng inventou os tipos móveis de argila cozida por volta de 1040, quatro séculos antes de Gutenberg.",
           "A fórmula escrita da pólvora mais antiga que se conhece aparece num manual militar Song de 1044."]}

  en:{short:"Mongols", date:"1271 – 1368", title:"The Mongol Yuan dynasty",

    facts:["The Mongol relay system, the yam, had thousands of stations with fresh horses across Asia.",

  pt:{short:"Mongóis", date:"1271 – 1368", title:"A dinastia mongol Yuan",

           "Pela primeira vez, toda a China foi governada por estrangeiros. O império ligava a China à Pérsia e à Europa; mercadores, missionários e artesãos percorriam suas estradas, entre eles, segundo seu famoso livro, o veneziano Marco Polo."],
    lname:"Khanbaliq, a cidade do Khan", ltext:"Kublai construiu uma nova capital, Khanbaliq ou Dadu, onde hoje fica Pequim. Seu traçado em grade, e o Grande Canal ampliado para abastecê-la, moldaram a cidade que seria a capital da China durante a maior parte dos 700 anos seguintes.",
    facts:["O sistema de revezamento mongol, o yam, tinha milhares de postos com cavalos descansados por toda a Ásia.",

  en:{short:"Mycenaeans", date:"c. 1600 – 1100 BC", title:"The first Greeks",
    story:["On the mainland, warrior kingdoms rose at Mycenae, Pylos, Tiryns and Thebes. Their rulers were buried with gold masks and bronze weapons. Around 1450 BC they took over Knossos, and they traded across the Aegean as far as Troy.",
           "Their genes were close to the Minoans', with one difference: a smaller share of ancestry from the steppes north of the Black Sea, brought by people who had moved south through the Balkans. Many researchers link this movement to the arrival of the Greek language."],
    lname:"Mycenae", ltext:"Mycenae's walls were built of stones so huge that later Greeks believed only the one-eyed giants, the Cyclopes, could have lifted them. Visitors still enter through the Lion Gate, built around 1250 BC.",
    facts:["The Mycenaeans wrote the oldest known form of Greek in a script called Linear B. The architect Michael Ventris deciphered it in 1952.",
           "Most Linear B tablets are palace inventories: sheep, oil, chariot wheels and lists of workers."]},
  pt:{short:"Micênicos", date:"c. 1600 – 1100 a.C.", title:"Os primeiros gregos",
    story:["No continente, surgiram reinos guerreiros em Micenas, Pilos, Tirinto e Tebas. Seus governantes eram enterrados com máscaras de ouro e armas de bronze. Por volta de 1450 a.C., eles tomaram Cnossos e comerciavam por todo o Egeu, até Troia.",
           "Seus genes eram parecidos com os dos minoicos, com uma diferença: uma parcela menor de ancestralidade das estepes ao norte do mar Negro, trazida por povos que desceram pelos Bálcãs. Muitos pesquisadores ligam esse movimento à chegada da língua grega."],
    lname:"Micenas", ltext:"As muralhas de Micenas foram feitas de pedras tão enormes que os gregos posteriores acreditavam que só os gigantes de um olho só, os ciclopes, poderiam tê-las erguido. Os visitantes ainda entram pela Porta dos Leões, construída por volta de 1250 a.C.",
    facts:["Os micênicos escreviam a forma mais antiga conhecida do grego, numa escrita chamada Linear B. O arquiteto Michael Ventris a decifrou em 1952.",
           "A maioria das tabuletas em Linear B são inventários dos palácios: ovelhas, azeite, rodas de carro e listas de trabalhadores."]}
},

  en:{short:"Collapse and the alphabet", date:"c. 1200 – 750 BC", title:"A dark age, then an alphabet",
    story:["Around 1200 BC the Mycenaean palaces were burned and abandoned, part of a wider collapse that shook Egypt, Anatolia and the Levant. Writing was forgotten, trade shrank and many people left for Cyprus and the coast of Anatolia. Later Greeks told of 'Dorians' arriving from the north; archaeologists still debate whether such a migration happened.",
           "Contact slowly returned. Phoenician merchants from Tyre and Sidon sailed into the Aegean, and Greeks from Euboea traded on the Syrian coast. Around 800 BC the Greeks borrowed the Phoenician alphabet and added letters for vowels, creating the alphabet that later gave rise to Latin and Cyrillic writing."],
    lname:"Lefkandi", ltext:"At Lefkandi, on the island of Euboea, a man and a woman were buried around 950 BC in a long building with gold jewellery and goods from Egypt and the Levant, proof that the 'dark age' was not completely dark.",
    facts:["The word 'alphabet' comes from its first two Greek letters, alpha and beta, borrowed from Phoenician aleph and beth.",
           "Homer's Iliad and Odyssey were probably written down in the 8th century BC, using the new alphabet."]},
  pt:{short:"Colapso e alfabeto", date:"c. 1200 – 750 a.C.", title:"Uma idade das trevas, e depois um alfabeto",
    story:["Por volta de 1200 a.C., os palácios micênicos foram incendiados e abandonados, parte de um colapso mais amplo que abalou o Egito, a Anatólia e o Levante. A escrita foi esquecida, o comércio encolheu e muitos partiram para Chipre e para a costa da Anatólia. Gregos posteriores falavam da chegada dos 'dórios' vindos do norte; os arqueólogos ainda debatem se essa migração aconteceu.",
           "O contato voltou aos poucos. Mercadores fenícios de Tiro e Sídon navegaram pelo Egeu, e gregos da Eubeia comerciavam na costa da Síria. Por volta de 800 a.C., os gregos adotaram o alfabeto fenício e acrescentaram letras para as vogais, criando o alfabeto que mais tarde deu origem às escritas latina e cirílica."],
    lname:"Lefkandi", ltext:"Em Lefkandi, na ilha de Eubeia, um homem e uma mulher foram enterrados por volta de 950 a.C. num edifício comprido, com joias de ouro e objetos do Egito e do Levante, prova de que a 'idade das trevas' não foi tão escura.",
    facts:["A palavra 'alfabeto' vem das duas primeiras letras gregas, alfa e beta, tiradas das letras fenícias aleph e beth.",
           "A Ilíada e a Odisseia de Homero provavelmente foram escritas no século VIII a.C., já com o novo alfabeto."]}
},

  en:{short:"Colonies across the sea", date:"c. 750 – 550 BC", title:"Greeks settle the shores of the Mediterranean",
    story:["As the population grew and good farmland ran short, Greek cities sent groups of settlers overseas to found new cities. Corinth founded Syracuse in Sicily, Megara founded Byzantium on the Bosporus, colonists from Thera founded Cyrene in Libya, and Phocaea, on the Anatolian coast, founded Massalia, today's Marseille.",
           "Within two centuries there were Greek cities from Spain to the Crimea. Southern Italy had so many that it was called Magna Graecia, 'Great Greece'. The colonies kept their mother city's gods and dialect but became independent cities of their own."],
    lname:"Corinth", ltext:"Corinth controlled the narrow isthmus between the Peloponnese and the mainland, with ports on two seas. Ships were dragged across the isthmus on a paved track called the diolkos, avoiding the long voyage around the Peloponnese.",
    facts:["Plato wrote that the Greeks lived around the sea 'like ants or frogs around a pond'.",
           "Marseille, Naples, Syracuse and Istanbul all began as Greek colonies; Naples comes from Neapolis, 'new city'."]},
  pt:{short:"Colônias além-mar", date:"c. 750 – 550 a.C.", title:"Os gregos ocupam as margens do Mediterrâneo",
    story:["Com o crescimento da população e a falta de boas terras, as cidades gregas enviaram grupos de colonos para fundar novas cidades além-mar. Corinto fundou Siracusa, na Sicília; Mégara fundou Bizâncio, no Bósforo; colonos de Tera fundaram Cirene, na Líbia; e Foceia, na costa da Anatólia, fundou Massália, a atual Marselha.",
           "Em dois séculos, havia cidades gregas da Espanha à Crimeia. O sul da Itália tinha tantas que passou a ser chamado de Magna Grécia. As colônias mantinham os deuses e o dialeto da cidade-mãe, mas se tornavam cidades independentes."],
    lname:"Corinto", ltext:"Corinto controlava o estreito istmo entre o Peloponeso e o continente, com portos em dois mares. Os navios eram arrastados pelo istmo numa pista pavimentada chamada diolkos, evitando a longa volta ao redor do Peloponeso.",
    facts:["Platão escreveu que os gregos viviam em volta do mar 'como formigas ou rãs em volta de um lago'.",
           "Marselha, Nápoles, Siracusa e Istambul começaram como colônias gregas; Nápoles vem de Neápolis, 'cidade nova'."]}

  en:{short:"Classical Athens", date:"490 – 323 BC", title:"Democracy, the Persian Wars and the Parthenon",
    story:["In 490 and again in 480 BC the Persian Empire invaded Greece. Athens and Sparta led the resistance, winning at Marathon, Salamis and Plataea. Victory made Athens the leading naval power of the Aegean.",
           "Athens had become a democracy in 508 BC, though only adult male citizens could vote. Its port, Piraeus, imported grain from the Black Sea and drew traders and craftsmen from across the Mediterranean. Thousands of free foreigners, called metics, lived in the city, alongside a large enslaved population."],
    lname:"The Acropolis", ltext:"On the rock above the city, the Athenians built the Parthenon between 447 and 432 BC, a temple to Athena paid for partly with money from their allies. It became one of the most copied buildings in history.",
    facts:["From 451 BC, Athenian citizenship was limited to children of an Athenian father and an Athenian mother.",
           "The marathon race is named after the legend of a runner who carried news of the victory from Marathon to Athens."]},
  pt:{short:"Atenas clássica", date:"490 – 323 a.C.", title:"Democracia, Guerras Médicas e o Partenon",
    story:["Em 490 e de novo em 480 a.C., o Império Persa invadiu a Grécia. Atenas e Esparta lideraram a resistência e venceram em Maratona, Salamina e Plateias. A vitória fez de Atenas a principal potência naval do Egeu.",
           "Atenas tinha se tornado uma democracia em 508 a.C., embora só os cidadãos homens adultos pudessem votar. Seu porto, o Pireu, importava trigo do mar Negro e atraía comerciantes e artesãos de todo o Mediterrâneo. Milhares de estrangeiros livres, chamados metecos, viviam na cidade, ao lado de uma grande população escravizada."],
    lname:"A Acrópole", ltext:"Na rocha acima da cidade, os atenienses construíram o Partenon entre 447 e 432 a.C., um templo a Atena pago em parte com o dinheiro dos aliados. Tornou-se um dos edifícios mais copiados da história.",
    facts:["A partir de 451 a.C., a cidadania ateniense ficou restrita aos filhos de pai ateniense e mãe ateniense.",
           "A corrida de maratona tem o nome da lenda de um mensageiro que levou a notícia da vitória de Maratona até Atenas."]}

  en:{short:"Alexander", date:"336 – 31 BC", title:"Greek goes global",
    story:["Philip II of Macedon united the Greek cities under his rule. His son Alexander then crossed into Asia in 334 BC and, in eleven years, conquered the Persian Empire from Egypt to the Indus. He died in Babylon in 323 BC, aged 32.",
           "His generals divided the empire into kingdoms ruled by Greek-speaking dynasties. Tens of thousands of Greeks and Macedonians moved east to new cities as soldiers, officials and merchants. A common form of Greek, the koine, became the language of trade and government from the Nile to Afghanistan, until Rome absorbed the last kingdom, Egypt, in 31 BC."],
    lname:"Alexandria", ltext:"Founded by Alexander in 331 BC, Alexandria became the largest Greek city in the world, with a lighthouse that counted among the Seven Wonders and a library that tried to collect every book ever written.",
    facts:["At Ai Khanoum, in northern Afghanistan, archaeologists found a Greek theatre, a huge gymnasium and moral sayings copied from Delphi, more than 4,000 km from Greece.",
           "The New Testament was written in koine Greek."]},
  pt:{short:"Alexandre", date:"336 – 31 a.C.", title:"O grego se torna global",
    story:["Filipe II da Macedônia unificou as cidades gregas sob seu domínio. Seu filho Alexandre atravessou para a Ásia em 334 a.C. e, em onze anos, conquistou o Império Persa, do Egito ao rio Indo. Morreu na Babilônia em 323 a.C., aos 32 anos.",
           "Seus generais dividiram o império em reinos governados por dinastias de língua grega. Dezenas de milhares de gregos e macedônios se mudaram para o leste, para novas cidades, como soldados, funcionários e mercadores. Uma forma comum de grego, a coiné, tornou-se a língua do comércio e do governo do Nilo ao Afeganistão, até que Roma absorveu o último reino, o Egito, em 31 a.C."],
    lname:"Alexandria", ltext:"Fundada por Alexandre em 331 a.C., Alexandria se tornou a maior cidade grega do mundo, com um farol que estava entre as Sete Maravilhas e uma biblioteca que tentava reunir todos os livros já escritos.",
    facts:["Em Ai Khanoum, no norte do Afeganistão, arqueólogos encontraram um teatro grego, um enorme ginásio e máximas morais copiadas de Delfos, a mais de 4 mil km da Grécia.",
           "O Novo Testamento foi escrito em grego coiné."]}

  en:{short:"Rome, Byzantium, Slavs", date:"146 BC – AD 1453", title:"From Roman province to Byzantine heartland",
    story:["Rome destroyed Corinth in 146 BC and turned Greece into a province, but Greek remained the language of the eastern Mediterranean. When Emperor Constantine moved the capital to Constantinople in AD 330, the eastern Roman Empire, later called Byzantine, became a Greek-speaking Christian state that lasted more than a thousand years.",
           "In the 6th and 7th centuries, Slavic groups crossed the Danube and settled across the Balkans, including much of mainland Greece. Ancient DNA suggests that Slavic-related ancestry makes up about 30–40% of the ancestry of people from mainland Greece today, and up to 20% on the Aegean islands. Most Slavs in Greece adopted the Greek language and Orthodox faith over the following centuries."],
    lname:"Constantinople", ltext:"Not in Greece today, but for a thousand years the Greek world's greatest city. Its church of Hagia Sophia, finished in 537, had the largest dome on Earth for centuries. Crusaders sacked the city in 1204, and the Ottomans conquered it in 1453.",
    facts:["Byzantines called themselves Romans (Romaioi); the word 'Byzantine' was coined by later historians.",
           "After 1204 Venice took Crete and many islands and ruled some of them for centuries."]},
  pt:{short:"Roma, Bizâncio, eslavos", date:"146 a.C. – 1453 d.C.", title:"De província romana a coração bizantino",
    story:["Roma destruiu Corinto em 146 a.C. e transformou a Grécia numa província, mas o grego continuou a ser a língua do Mediterrâneo oriental. Quando o imperador Constantino transferiu a capital para Constantinopla, em 330 d.C., o Império Romano do Oriente, mais tarde chamado bizantino, tornou-se um Estado cristão de língua grega que durou mais de mil anos.",
           "Nos séculos VI e VII, grupos eslavos atravessaram o Danúbio e se fixaram em todos os Bálcãs, incluindo boa parte da Grécia continental. O DNA antigo sugere que a ancestralidade de tipo eslavo corresponde a cerca de 30–40% da ancestralidade das pessoas da Grécia continental hoje, e a até 20% nas ilhas do Egeu. A maioria dos eslavos da Grécia adotou a língua grega e a fé ortodoxa nos séculos seguintes."],
    lname:"Constantinopla", ltext:"Hoje fora da Grécia, mas por mil anos a maior cidade do mundo grego. Sua igreja de Santa Sofia, concluída em 537, teve a maior cúpula do planeta durante séculos. Os cruzados saquearam a cidade em 1204, e os otomanos a conquistaram em 1453.",
    facts:["Os bizantinos se chamavam de romanos (Romaioi); a palavra 'bizantino' foi criada por historiadores posteriores.",
           "Depois de 1204, Veneza tomou Creta e muitas ilhas e governou algumas delas por séculos."]}

  en:{short:"Ottoman Greece", date:"1453 – 1821", title:"Four centuries under the sultans",
    story:["The Ottoman Turks took Thessaloniki in 1430, Constantinople in 1453 and Athens in 1458. Venice held on to Corfu and the Ionian Islands and, until 1669, to Crete. The Ottoman Empire mixed peoples: Muslim Turks settled in towns and plains, and Albanian-speaking Christians, the Arvanites, had already moved into Attica and the Peloponnese in the 14th and 15th centuries.",
           "When Spain expelled its Jews in 1492, the sultan welcomed thousands to Thessaloniki. By the 1500s they were the majority of the city. Greek Orthodox merchants and sailors built trading networks from Vienna and Venice to Odessa, and their wealth and schools fed the ideas of independence."],
    lname:"Thessaloniki", ltext:"For more than 400 years, Thessaloniki's streets spoke Judaeo-Spanish (Ladino), Greek and Turkish. In 1943 the German occupiers deported around 50,000 of its Jews to Auschwitz, where nearly all of them were murdered.",
    facts:["Greek Orthodox Christians in the Ottoman Empire were governed as a community, the Rum millet, led by the Patriarch in Constantinople.",
           "Many Arvanite villages around Athens spoke an Albanian dialect until the 20th century."]},
  pt:{short:"Grécia otomana", date:"1453 – 1821", title:"Quatro séculos sob os sultões",
    story:["Os turcos otomanos tomaram Tessalônica em 1430, Constantinopla em 1453 e Atenas em 1458. Veneza manteve Corfu e as ilhas Jônicas e, até 1669, Creta. O Império Otomano misturava povos: turcos muçulmanos se fixaram em cidades e planícies, e cristãos de língua albanesa, os arvanitas, já tinham se instalado na Ática e no Peloponeso nos séculos XIV e XV.",
           "Quando a Espanha expulsou seus judeus em 1492, o sultão acolheu milhares deles em Tessalônica. No século XVI, eles já eram a maioria da cidade. Mercadores e marinheiros gregos ortodoxos criaram redes de comércio de Viena e Veneza até Odessa, e sua riqueza e suas escolas alimentaram as ideias de independência."],
    lname:"Tessalônica", ltext:"Por mais de 400 anos, as ruas de Tessalônica falaram judeu-espanhol (ladino), grego e turco. Em 1943, os ocupantes alemães deportaram cerca de 50 mil de seus judeus para Auschwitz, onde quase todos foram assassinados.",
    facts:["Os cristãos ortodoxos gregos do Império Otomano eram governados como uma comunidade, o millet Rum, liderado pelo Patriarca de Constantinopla.",
           "Muitas aldeias arvanitas em volta de Atenas falaram um dialeto albanês até o século XX."]}

  en:{short:"Independence and exchange", date:"1821 – 1923", title:"A new state and a million refugees",
    story:["The War of Independence began in 1821, and in 1830 a small Greek kingdom was recognized. Nafplio was its first capital; Athens, then a small town, replaced it in 1834. Over the next century the country grew northward, but millions of Greeks still lived in the Ottoman Empire, in Constantinople, Smyrna, Cappadocia and on the Black Sea coast of Pontus.",
           "After defeat in a war with Turkey, the Greek army withdrew from Anatolia in 1922 and Smyrna burned. In January 1923 the two countries agreed a compulsory population exchange based on religion. About 1.2 million Orthodox Christians came to Greece, and about 355,000–400,000 Muslims left Greece for Turkey. In the 1928 census, refugees were about one in five of Greece's people."],
    lname:"Athens and Piraeus", ltext:"Refugees built whole new neighbourhoods, often named after the homes they had lost: Nea Smyrni (New Smyrna), Nea Ionia, Kaisariani. They brought dishes, saints, dialects and rebetiko, the 'Greek blues'.",
    facts:["The exchange was based on religion, not language: many Orthodox refugees from Cappadocia spoke Turkish, and many Muslims from Crete spoke Greek.",
           "In the 1928 census, refugees made up about 45% of the population of Greek Macedonia."]},
  pt:{short:"Independência e troca", date:"1821 – 1923", title:"Um novo Estado e um milhão de refugiados",
    story:["A Guerra de Independência começou em 1821, e em 1830 um pequeno reino grego foi reconhecido. Náuplia foi a primeira capital; Atenas, então uma cidade pequena, a substituiu em 1834. No século seguinte, o país cresceu para o norte, mas milhões de gregos ainda viviam no Império Otomano, em Constantinopla, Esmirna, na Capadócia e no litoral do mar Negro, o Ponto.",
           "Depois de perder uma guerra contra a Turquia, o exército grego se retirou da Anatólia em 1922, e Esmirna foi incendiada. Em janeiro de 1923, os dois países acordaram uma troca obrigatória de populações com base na religião. Cerca de 1,2 milhão de cristãos ortodoxos vieram para a Grécia, e cerca de 355 mil a 400 mil muçulmanos deixaram a Grécia rumo à Turquia. No censo de 1928, os refugiados eram cerca de um em cada cinco habitantes da Grécia."],
    lname:"Atenas e Pireu", ltext:"Os refugiados construíram bairros inteiros, muitas vezes com o nome das terras que tinham perdido: Nea Smyrni (Nova Esmirna), Nea Ionia, Kaisariani. Trouxeram pratos, santos, dialetos e o rebetiko, o 'blues grego'.",
    facts:["A troca foi baseada na religião, não na língua: muitos refugiados ortodoxos da Capadócia falavam turco, e muitos muçulmanos de Creta falavam grego.",
           "No censo de 1928, os refugiados eram cerca de 45% da população da Macedônia grega."]}

  en:{short:"Today", date:"1890s – today", title:"A country of departures, then of arrivals",
    story:["For a century Greece was a land people left. Hundreds of thousands sailed to the United States before the 1920s. After the Second World War and the civil war, about 220,000 emigrated in the 1950s and 406,000 in the 1960s, many to Australia, Canada and West Germany, which signed a labour agreement with Greece in 1960. During the debt crisis of the 2010s, many young Greeks left again.",
           "Since 1990 Greece has also become a country of arrival: first Albanians, the largest group ever since, and Pontic Greeks from the former Soviet Union; then people from Asia and Africa. In 2015 more than 850,000 refugees and migrants, mostly from Syria, Afghanistan and Iraq, crossed by sea from Turkey to the Greek islands. In mid-2025 about 900,000 people lived legally in Greece as migrants, EU citizens or refugees."],

  en:{short:"Rise of Rome", date:"509 – 27 BC", title:"A city-state conquers Italy",
    story:["Rome expelled its last king in 509 BC and became a republic. Through wars and alliances it took control of the whole peninsula by around 270 BC, linking it with roads such as the Via Appia, begun in 312 BC.",
           "Then came the struggle with Carthage. In 218 BC Hannibal marched from Spain over the Pyrenees and the Alps with an army and war elephants, and crushed the Romans at Cannae. Rome survived, won, and in 146 BC destroyed Carthage. After the Social War of 91–88 BC, Roman citizenship was extended to the free peoples of Italy."],
    lname:"Rome", ltext:"The Forum, a marshy valley drained by the Etruscan-era sewer, the Cloaca Maxima, became the centre of Roman political life: temples, law courts, the Senate house and the speakers' platform.",
    facts:["Most of Hannibal's elephants died during the crossing of the Alps or soon after.",
           "Latin, at first the language of one small region around Rome, slowly replaced Etruscan, Oscan, Umbrian and Greek across most of Italy."]},
  pt:{short:"Ascensão de Roma", date:"509 – 27 a.C.", title:"Uma cidade-Estado conquista a Itália",
    story:["Roma expulsou seu último rei em 509 a.C. e se tornou uma república. Por meio de guerras e alianças, controlou toda a península por volta de 270 a.C., ligando-a com estradas como a Via Ápia, iniciada em 312 a.C.",
           "Depois veio a luta contra Cartago. Em 218 a.C., Aníbal marchou da Espanha pelos Pireneus e pelos Alpes com um exército e elefantes de guerra, e esmagou os romanos em Canas. Roma resistiu, venceu e, em 146 a.C., destruiu Cartago. Depois da Guerra Social de 91–88 a.C., a cidadania romana foi estendida aos povos livres da Itália."],
    lname:"Roma", ltext:"O Fórum, um vale pantanoso drenado pelo esgoto da época etrusca, a Cloaca Máxima, tornou-se o centro da vida política romana: templos, tribunais, a sede do Senado e a tribuna dos oradores.",
    facts:["A maior parte dos elefantes de Aníbal morreu durante a travessia dos Alpes ou logo depois.",
           "O latim, no início a língua de uma pequena região em volta de Roma, substituiu aos poucos o etrusco, o osco, o úmbrio e o grego na maior parte da Itália."]}

  en:{short:"Imperial Rome", date:"27 BC – AD 476", title:"A city of a million, from everywhere",
    story:["Under Augustus and his successors Rome became the largest city in the world, with perhaps a million people. Grain ships sailed from Egypt and North Africa to Ostia; merchants, soldiers, teachers and slaves arrived from every province. In AD 212 Emperor Caracalla granted citizenship to almost all free people in the empire.",
           "Ancient DNA shows how mixed Rome became. Genomes from the imperial period show a large shift toward ancestry from the eastern Mediterranean and the Near East, the most densely populated part of the empire. Studies link it to the movement of merchants, soldiers and enslaved people. In the 5th century the western empire collapsed: Rome was sacked in 410, and the last western emperor was deposed in 476."],
    lname:"Rome", ltext:"The Colosseum, opened in AD 80, could hold some 50,000 spectators for gladiator fights and animal hunts. Among its crowds were people born in Syria, Egypt, Spain, Gaul and Britain.",
    facts:["Many enslaved people in Rome came from the Greek-speaking East, and many were later freed; freed slaves and their children made up a large part of the city's population.",
           "As the empire declined, Rome's population shrank to a small fraction of its peak."]},
  pt:{short:"Roma imperial", date:"27 a.C. – 476 d.C.", title:"Uma cidade de um milhão, vindo de todo lugar",
    story:["Com Augusto e seus sucessores, Roma se tornou a maior cidade do mundo, com talvez um milhão de habitantes. Navios de trigo vinham do Egito e do norte da África até Óstia; mercadores, soldados, professores e escravizados chegavam de todas as províncias. Em 212 d.C., o imperador Caracala concedeu a cidadania a quase todos os habitantes livres do império.",
           "O DNA antigo mostra como Roma se tornou misturada. Genomas do período imperial mostram uma grande mudança rumo à ancestralidade do Mediterrâneo oriental e do Oriente Próximo, a parte mais povoada do império. Os estudos ligam isso à circulação de mercadores, soldados e pessoas escravizadas. No século V, o império do Ocidente desabou: Roma foi saqueada em 410, e o último imperador do Ocidente foi deposto em 476."],
    lname:"Roma", ltext:"O Coliseu, inaugurado em 80 d.C., recebia cerca de 50 mil espectadores para lutas de gladiadores e caçadas de animais. No público havia pessoas nascidas na Síria, no Egito, na Hispânia, na Gália e na Britânia.",
    facts:["Muitos escravizados em Roma vinham do Oriente de língua grega, e muitos foram libertados depois; libertos e seus filhos eram uma grande parte da população da cidade.",
           "Com o declínio do império, a população de Roma encolheu para uma pequena fração do seu auge."]}

  en:{short:"Goths and Lombards", date:"476 – 774", title:"Germanic kings and Byzantine generals",
    story:["After 476, Germanic rulers governed Italy. Theodoric the Ostrogoth arrived from the Balkans in 489 and ruled from Ravenna. Then Emperor Justinian, from Constantinople, sent his armies to reconquer Italy; the war, from 535 to 554, devastated the peninsula.",
           "In 568 the Lombards, a Germanic people from Pannonia (today's Hungary), crossed the eastern Alps under King Alboin and took most of the north, with their capital at Pavia. Italy was divided between Lombards and Byzantines for two centuries, until Charlemagne conquered the Lombard kingdom in 774. Ancient DNA shows northern European ancestry spreading across the peninsula in this period."],
    lname:"Ravenna", ltext:"Capital of the Ostrogoths and then of Byzantine Italy, Ravenna kept glittering mosaics in its churches, among them portraits of Justinian and Empress Theodora in San Vitale.",
    facts:["The region of Lombardy is named after the Lombards.",
           "The Lombard arrival broke the political unity of Italy for the first time since the Roman conquest; it would not be reunited until 1861."]},
  pt:{short:"Godos e lombardos", date:"476 – 774", title:"Reis germânicos e generais bizantinos",
    story:["Depois de 476, governantes germânicos dominaram a Itália. Teodorico, o Ostrogodo, chegou dos Bálcãs em 489 e governou a partir de Ravena. Depois o imperador Justiniano, de Constantinopla, enviou seus exércitos para reconquistar a Itália; a guerra, de 535 a 554, devastou a península.",
           "Em 568, os lombardos, um povo germânico da Panônia (atual Hungria), atravessaram os Alpes orientais sob o rei Alboíno e tomaram a maior parte do norte, com capital em Pavia. A Itália ficou dividida entre lombardos e bizantinos por dois séculos, até que Carlos Magno conquistou o reino lombardo em 774. O DNA antigo mostra a ancestralidade do norte da Europa se espalhando pela península nesse período."],
    lname:"Ravena", ltext:"Capital dos ostrogodos e depois da Itália bizantina, Ravena guardou mosaicos reluzentes em suas igrejas, entre eles os retratos de Justiniano e da imperatriz Teodora em San Vitale.",
    facts:["A região da Lombardia tem esse nome por causa dos lombardos.",
           "A chegada dos lombardos rompeu a unidade política da Itália pela primeira vez desde a conquista romana; ela só seria reunificada em 1861."]}

  en:{short:"Arabs, Normans, sea republics", date:"827 – 1300", title:"Sicily between three worlds",
    story:["In 827 an Arab and Berber army from Ifriqiya (today's Tunisia) landed at Mazara. Palermo fell in 831, and by 965 all of Sicily was under Muslim rule. Under the emirs, Palermo became one of the largest cities in Europe. Between 1061 and 1091 Norman knights from northern France conquered the island and built a kingdom where Latin, Greek and Arabic were all used at court.",
           "In the north, the sea republics of Venice, Genoa, Pisa and Amalfi grew rich on trade with Constantinople, the Levant and the Black Sea, with merchant colonies far from home."],
    lname:"Palermo", ltext:"Palermo's Norman palace chapel and cathedrals mix Byzantine mosaics, Arabic inscriptions and carved wooden ceilings in Islamic style; 'Arab-Norman Palermo' is a UNESCO World Heritage Site.",
    facts:["Many Sicilian place names come from Arabic: Caltanissetta, Marsala ('port of God') and many towns beginning with 'Calta' (from qal'at, fortress).",
           "Emperor Frederick II later deported Sicily's remaining Muslims to Lucera, in Apulia; the community was destroyed in 1300."]},
  pt:{short:"Árabes, normandos, repúblicas", date:"827 – 1300", title:"A Sicília entre três mundos",
    story:["Em 827, um exército árabe e berbere de Ifríquia (atual Tunísia) desembarcou em Mazara. Palermo caiu em 831 e, em 965, toda a Sicília estava sob domínio muçulmano. Com os emires, Palermo se tornou uma das maiores cidades da Europa. Entre 1061 e 1091, cavaleiros normandos do norte da França conquistaram a ilha e criaram um reino onde latim, grego e árabe eram usados na corte.",
           "No norte, as repúblicas marítimas de Veneza, Gênova, Pisa e Amalfi enriqueceram com o comércio com Constantinopla, o Levante e o mar Negro, com colônias mercantes longe de casa."],
    lname:"Palermo", ltext:"A capela do palácio normando e as catedrais de Palermo misturam mosaicos bizantinos, inscrições árabes e tetos de madeira entalhada em estilo islâmico; a 'Palermo árabe-normanda' é Patrimônio Mundial da UNESCO.",
    facts:["Muitos nomes de lugares sicilianos vêm do árabe: Caltanissetta, Marsala ('porto de Deus') e muitas cidades que começam com 'Calta' (de qal'at, fortaleza).",
           "O imperador Frederico II depois deportou os muçulmanos que restavam na Sicília para Lucera, na Apúlia; a comunidade foi destruída em 1300."]}

  en:{short:"Renaissance and foreign rule", date:"1300 – 1800", title:"Plague, Renaissance and newcomers",
    story:["In 1347 Genoese ships from the Black Sea brought the Black Death to Messina; within a few years it had killed a huge share of Italy's people. The cities recovered, and Florence, Venice, Milan and Rome led the Renaissance in art and learning.",
           "Newcomers kept arriving. From the 1440s, Albanian soldiers and refugees fleeing the Ottomans founded dozens of villages in southern Italy; their descendants, the Arbëreshë, still live in about 50 communities. In 1591 and 1593 the Medici invited merchants of every faith to Livorno, and thousands of Sephardic Jews came from Iberia. Meanwhile much of Italy, including Naples, Sicily and Milan, came under Spanish and later Austrian rule."],
    lname:"Florence", ltext:"Brunelleschi's dome over Florence's cathedral, finished in 1436, was the largest brick dome ever built. Florence's bankers, wool merchants and painters made it the capital of the early Renaissance.",
    facts:["The Arbëreshë still speak an old form of Albanian, and many of their churches follow the Byzantine rite.",
           "The word 'quarantine' comes from the Venetian quaranta giorni, 'forty days', the time ships had to wait before landing during plague outbreaks."]},
  pt:{short:"Renascimento e domínio estrangeiro", date:"1300 – 1800", title:"Peste, Renascimento e recém-chegados",
    story:["Em 1347, navios genoveses vindos do mar Negro trouxeram a Peste Negra a Messina; em poucos anos ela matou uma enorme parte da população italiana. As cidades se recuperaram, e Florença, Veneza, Milão e Roma lideraram o Renascimento nas artes e no saber.",
           "Os recém-chegados não pararam. A partir da década de 1440, soldados e refugiados albaneses que fugiam dos otomanos fundaram dezenas de aldeias no sul da Itália; seus descendentes, os arbëreshë, ainda vivem em cerca de 50 comunidades. Em 1591 e 1593, os Médici convidaram mercadores de todas as fés para Livorno, e milhares de judeus sefarditas vieram da Península Ibérica. Enquanto isso, boa parte da Itália, incluindo Nápoles, a Sicília e Milão, ficou sob domínio espanhol e depois austríaco."],
    lname:"Florença", ltext:"A cúpula de Brunelleschi sobre a catedral de Florença, concluída em 1436, foi a maior cúpula de tijolos já construída. Banqueiros, mercadores de lã e pintores fizeram de Florença a capital do início do Renascimento.",
    facts:["Os arbëreshë ainda falam uma forma antiga de albanês, e muitas de suas igrejas seguem o rito bizantino.",
           "A palavra 'quarentena' vem do veneziano quaranta giorni, 'quarenta dias', o tempo que os navios tinham de esperar antes de desembarcar nas épocas de peste."]}

  en:{short:"Unification", date:"1815 – 1871", title:"Garibaldi, from Brazil to Rome",
    story:["After Napoleon's fall in 1815, Italy was again split into states, many under Austrian influence. A movement called the Risorgimento, 'resurgence', set out to unite it. One of its heroes learned to fight in Brazil: Giuseppe Garibaldi, exiled in 1836, fought for the Riograndense Republic in the Ragamuffin War, where he met Anita, a Brazilian woman from Santa Catarina who fought beside him.",
           "Back in Italy from 1848, Garibaldi led the Expedition of the Thousand in 1860, sailing from near Genoa to Sicily and marching to Naples. The Kingdom of Italy was proclaimed in 1861, with Turin as its first capital. Venice joined in 1866, and Rome in 1870, becoming the capital in 1871."],
    lname:"Rome", ltext:"Rome was the last piece. Italian troops entered the city through a breach near Porta Pia on 20 September 1870, ending more than a thousand years of papal rule over Rome.",
    facts:["Garibaldi's volunteers wore red shirts, a uniform he had first used in South America.",
           "Anita Garibaldi died in Italy in 1849 while fleeing with Garibaldi; she is honoured in both Brazil and Italy."]},
  pt:{short:"Unificação", date:"1815 – 1871", title:"Garibaldi, do Brasil a Roma",
    story:["Depois da queda de Napoleão, em 1815, a Itália voltou a se dividir em Estados, muitos sob influência austríaca. Um movimento chamado Risorgimento, 'ressurgimento', quis unificá-la. Um de seus heróis aprendeu a lutar no Brasil: Giuseppe Garibaldi, exilado em 1836, lutou pela República Rio-Grandense na Guerra dos Farrapos, onde conheceu Anita, uma brasileira de Santa Catarina que lutou ao seu lado.",
           "De volta à Itália a partir de 1848, Garibaldi liderou a Expedição dos Mil em 1860, partindo de perto de Gênova até a Sicília e marchando até Nápoles. O Reino da Itália foi proclamado em 1861, com Turim como primeira capital. Veneza foi incorporada em 1866 e Roma em 1870, tornando-se a capital em 1871."],
    lname:"Roma", ltext:"Roma foi a última peça. Tropas italianas entraram na cidade por uma brecha perto da Porta Pia em 20 de setembro de 1870, encerrando mais de mil anos de governo papal sobre Roma.",
    facts:["Os voluntários de Garibaldi usavam camisas vermelhas, um uniforme que ele usou primeiro na América do Sul.",
           "Anita Garibaldi morreu na Itália em 1849, fugindo com Garibaldi; ela é homenageada no Brasil e na Itália."]}

  en:{short:"First Americans", date:"c. 23,000 – 13,000 years ago", title:"Footprints in an ancient lake",
    story:["Archaeologists long believed that the first Americans arrived about 13,000 years ago, makers of the Clovis spearpoints found across the continent. Discoveries since then have pushed the date back: people were living at Monte Verde, in Chile, about 14,500 years ago.",
           "The biggest surprise came from New Mexico. In White Sands National Park, human footprints pressed into the mud of an ancient lakeshore have been dated to between 21,000 and 23,000 years ago, at the height of the last Ice Age. How these people got south of the ice sheets, along the Pacific coast by boat or through a gap inland, is still debated."],
    lname:"White Sands", ltext:"The footprints, many of them of children and teenagers, sit beside tracks of mammoths and giant ground sloths. A 2023 study re-dated them with pollen and quartz grains and confirmed the age.",
    facts:["The first Americans hunted mammoths, mastodons and giant bison, all of which became extinct by about 12,000–11,000 years ago.",
           "Almost all Native American peoples, from Alaska to Chile, descend from the same founding population."]},
  pt:{short:"Primeiros americanos", date:"há c. 23 mil – 13 mil anos", title:"Pegadas num lago antigo",
    story:["Por muito tempo, os arqueólogos acreditaram que os primeiros americanos chegaram há cerca de 13 mil anos, os criadores das pontas de lança Clovis encontradas por todo o continente. Descobertas posteriores recuaram a data: já havia gente vivendo em Monte Verde, no Chile, há cerca de 14.500 anos.",
           "A maior surpresa veio do Novo México. No Parque Nacional White Sands, pegadas humanas marcadas na lama da margem de um lago antigo foram datadas entre 21 mil e 23 mil anos atrás, no auge da última Era do Gelo. Como essas pessoas chegaram ao sul das geleiras, de barco pela costa do Pacífico ou por uma passagem no interior, ainda é debatido."],
    lname:"White Sands", ltext:"As pegadas, muitas de crianças e adolescentes, estão ao lado de rastros de mamutes e preguiças-gigantes. Um estudo de 2023 as datou de novo com pólen e grãos de quartzo e confirmou a idade.",
    facts:["Os primeiros americanos caçavam mamutes, mastodontes e bisões-gigantes, todos extintos por volta de 12 mil a 11 mil anos atrás.",
           "Quase todos os povos indígenas, do Alasca ao Chile, descendem da mesma população fundadora."]}

  en:{short:"Native nations", date:"c. 11,000 BC – AD 1500", title:"A continent of many nations",
    story:["Over thousands of years, Native Americans developed hundreds of nations and languages, adapted to forests, deserts, plains and coasts. Maize, first domesticated in Mexico, spread north, along with beans and squash. In the Southwest, the Ancestral Puebloans built multi-storey stone towns at Chaco Canyon and cliff dwellings at Mesa Verde.",
           "Along the Mississippi, farming peoples built cities of earthen mounds. Trade networks carried copper from Lake Superior, shells from the Gulf of Mexico and, in the Southwest, macaw feathers and cacao from Mexico. By 1492, millions of people lived in what is now the United States."],
    lname:"Cahokia", ltext:"Around 1100, Cahokia, near today's St. Louis, had perhaps 20,000 people, more than London at the time. Monks Mound, about 30 metres high, is the largest earthen mound in North America. The city was abandoned by about 1350.",
    facts:["Chaco Canyon's Pueblo Bonito had hundreds of rooms and stayed the largest building in North America until the 19th century.",

  pt:{short:"Nações indígenas", date:"c. 11.000 a.C. – 1500 d.C.", title:"Um continente de muitas nações",
    story:["Ao longo de milhares de anos, os indígenas americanos formaram centenas de nações e línguas, adaptadas a florestas, desertos, planícies e litorais. O milho, domesticado no México, se espalhou para o norte, junto com o feijão e a abóbora. No Sudoeste, os Ancestrais Pueblo construíram cidades de pedra com vários andares em Chaco Canyon e moradias nos penhascos de Mesa Verde.",
           "Às margens do Mississippi, povos agricultores construíram cidades de montes de terra. Redes de comércio levavam cobre do lago Superior, conchas do golfo do México e, no Sudoeste, penas de arara e cacau do México. Em 1492, milhões de pessoas viviam no que hoje são os Estados Unidos."],
    lname:"Cahokia", ltext:"Por volta de 1100, Cahokia, perto da atual St. Louis, tinha talvez 20 mil habitantes, mais do que Londres na época. O Monks Mound, com cerca de 30 metros de altura, é o maior monte de terra da América do Norte. A cidade foi abandonada por volta de 1350.",
    facts:["O Pueblo Bonito, em Chaco Canyon, tinha centenas de cômodos e foi o maior edifício da América do Norte até o século XIX.",
           "Muitos nomes de lugares nos EUA vêm de línguas indígenas: Massachusetts, Ohio, Mississippi, Chicago e Seattle, entre outros."]}

  en:{short:"Europeans arrive", date:"1492 – 1600", title:"Spanish ships, and invisible killers",
    story:["After Columbus reached the Caribbean in 1492, Spanish expeditions explored the south of today's United States: Ponce de León in Florida, Hernando de Soto across the Southeast, and Coronado through the Southwest to Kansas in search of gold. In 1565 Spain founded St. Augustine in Florida, the oldest continuously inhabited European town in the United States.",

  pt:{short:"Chegam os europeus", date:"1492 – 1600", title:"Navios espanhóis e assassinos invisíveis",
    story:["Depois que Colombo chegou ao Caribe em 1492, expedições espanholas exploraram o sul dos atuais Estados Unidos: Ponce de León na Flórida, Hernando de Soto pelo Sudeste e Coronado pelo Sudoeste até o Kansas, em busca de ouro. Em 1565, a Espanha fundou Santo Agostinho (St. Augustine), na Flórida, a cidade europeia habitada continuamente mais antiga dos Estados Unidos.",

  en:{short:"Enslaved Africans", date:"1619 – 1865", title:"Chains across the Atlantic",
    story:["In 1619 about twenty Africans, captured from a Portuguese slave ship, were brought to Point Comfort in Virginia. Over the next two centuries around 388,000 enslaved Africans were shipped directly to what became the United States, about 5% of all those carried to the Americas, far fewer than to Brazil or the Caribbean. Senegambia and West Central Africa (Angola and Congo) supplied nearly half of them, and almost half landed at Charleston, South Carolina.",

  pt:{short:"Africanos escravizados", date:"1619 – 1865", title:"Correntes através do Atlântico",
    story:["Em 1619, cerca de vinte africanos, tomados de um navio negreiro português, foram levados a Point Comfort, na Virgínia. Nos dois séculos seguintes, cerca de 388 mil africanos escravizados foram trazidos diretamente para o que se tornaria os Estados Unidos, cerca de 5% de todos os levados às Américas, muito menos do que para o Brasil ou o Caribe. A Senegâmbia e a África Centro-Ocidental (Angola e Congo) forneceram quase metade deles, e quase metade desembarcou em Charleston, na Carolina do Sul.",
           "A importação de escravizados foi proibida em 1808, mas a escravidão cresceu pelos nascimentos. Em 1860, quase 4 milhões de pessoas eram escravizadas, e cerca de um milhão tinha sido levado à força do Alto Sul para as plantações de algodão do Sul Profundo, separando famílias."],
    lname:"Charleston", ltext:"Cerca de 48% dos africanos trazidos diretamente para os Estados Unidos chegaram por Charleston. As comunidades gullah geechee, nas ilhas costeiras próximas, mantêm até hoje palavras, artesanato e comidas africanas.",
    facts:["O cultivo de arroz na Carolina do Sul dependia do conhecimento de escravizados vindos da costa arrozeira da África Ocidental.",

  en:{short:"Irish, Germans, Chinese", date:"1840 – 1882", title:"Famine, revolution and a railroad",
    story:["Between 1820 and 1870 more than 7.5 million immigrants arrived; about a third were Irish and almost a third German. When Ireland's potato crop failed three years in a row, over 750,000 people starved, and more than two million eventually left for America. More than a million Germans came between 1845 and 1855, fleeing hard times and the failed revolution of 1848.",
           "On the Pacific coast, Chinese workers came for the gold rush and stayed to build the first transcontinental railroad, finished in 1869; up to 15,000 worked on it at the peak. Hostility followed: the Chinese Exclusion Act of 1882 was the first US law to ban immigration by nationality."],
    lname:"New York", ltext:"From 1855 to 1890, immigrants landing in New York were processed at Castle Garden, at the tip of Manhattan. Irish and German neighbourhoods filled the city, and in 1850 immigrants made up nearly 10% of the whole US population.",
    facts:["There are more Americans of Irish descent today than people in Ireland.",
           "German immigrants brought the kindergarten, the Christmas tree tradition and lager beer to the United States."]},
  pt:{short:"Irlandeses, alemães, chineses", date:"1840 – 1882", title:"Fome, revolução e uma ferrovia",
    story:["Entre 1820 e 1870, chegaram mais de 7,5 milhões de imigrantes; cerca de um terço era irlandês e quase um terço, alemão. Quando a batata da Irlanda falhou três anos seguidos, mais de 750 mil pessoas morreram de fome, e mais de dois milhões acabaram partindo para a América. Mais de um milhão de alemães chegaram entre 1845 e 1855, fugindo de tempos difíceis e da revolução fracassada de 1848.",
           "Na costa do Pacífico, trabalhadores chineses vieram pela corrida do ouro e ficaram para construir a primeira ferrovia transcontinental, concluída em 1869; até 15 mil trabalharam nela no pico. A hostilidade veio em seguida: a Lei de Exclusão dos Chineses, de 1882, foi a primeira lei americana a proibir a imigração por nacionalidade."],
    lname:"Nova York", ltext:"De 1855 a 1890, os imigrantes que chegavam a Nova York passavam por Castle Garden, na ponta de Manhattan. Bairros irlandeses e alemães encheram a cidade, e em 1850 os imigrantes eram quase 10% de toda a população dos EUA.",
    facts:["Há hoje mais americanos de origem irlandesa do que pessoas na Irlanda.",
           "Os imigrantes alemães levaram aos Estados Unidos o jardim de infância, a tradição da árvore de Natal e a cerveja lager."]}

  en:{short:"The Great Migration", date:"1861 – 1970", title:"Freedom, and a journey north",
    story:["The Civil War of 1861–1865, the deadliest war in American history, ended slavery. But in the South, segregation laws, lynching and sharecropping debt soon trapped Black Americans in poverty and fear.",
           "From about 1910, they began to leave. Over six decades, roughly six million Black Southerners moved to the cities of the North, Midwest and West, to Chicago, Detroit, New York, Philadelphia and Los Angeles, drawn by factory jobs and the hope of dignity. It was one of the largest internal migrations in history, and it reshaped American music, politics and cities."],
    lname:"Chicago", ltext:"Trains of the Illinois Central brought migrants from the Mississippi Delta straight to Chicago. They carried the blues with them: in Chicago it went electric, and from there it led to rock and roll.",

  pt:{short:"A Grande Migração", date:"1861 – 1970", title:"Liberdade, e uma viagem para o norte",
    story:["A Guerra Civil de 1861–1865, a guerra mais mortal da história americana, acabou com a escravidão. Mas no Sul, leis de segregação, linchamentos e as dívidas da parceria agrícola logo prenderam os negros americanos na pobreza e no medo.",
           "A partir de cerca de 1910, eles começaram a partir. Em seis décadas, cerca de seis milhões de negros do Sul se mudaram para as cidades do Norte, do Meio-Oeste e do Oeste, para Chicago, Detroit, Nova York, Filadélfia e Los Angeles, atraídos pelos empregos nas fábricas e pela esperança de dignidade. Foi uma das maiores migrações internas da história, e transformou a música, a política e as cidades americanas."],
    lname:"Chicago", ltext:"Os trens da Illinois Central levavam migrantes do Delta do Mississippi direto a Chicago. Eles levaram o blues junto: em Chicago, o blues se tornou elétrico e, dali, levou ao rock and roll.",
    facts:["O pintor Jacob Lawrence contou a história da Grande Migração numa série de 60 painéis pintados em 1940–41.",
           "Em 1910, cerca de 90% dos negros americanos viviam no Sul; em 1970, era cerca da metade."]}

  en:{short:"Ellis Island", date:"1880 – 1924", title:"The golden door",
    story:["From the 1880s the main source of immigrants shifted to southern and eastern Europe: Italians, Jews fleeing pogroms in the Russian Empire, Poles, Greeks, Hungarians and many more. In 1890 immigrants were 14.8% of the population. From 1892 most of them passed through Ellis Island in New York harbour, where about 12 million people were processed by 1924; only about 2% were turned away.",
           "Portuguese immigrants, mainly from the Azores, Madeira and Cape Verde, settled in the whaling and mill towns of Massachusetts and Rhode Island. A backlash grew, and the Immigration Act of 1924 set national quotas that favoured northern Europe and almost shut the door on southern and eastern Europeans and Asians."],
    lname:"Ellis Island", ltext:"Arrivals climbed to the Registry Room, where doctors watched them on the stairs for signs of illness. An estimated 40% of Americans today have at least one ancestor who passed through the island.",
    facts:["The Statue of Liberty, a gift from France unveiled in 1886, carries Emma Lazarus's poem: 'Give me your tired, your poor, your huddled masses yearning to breathe free'.",
           "Fall River, Massachusetts, is nearly half Portuguese-American, the highest share of any US city."]},
  pt:{short:"Ellis Island", date:"1880 – 1924", title:"A porta dourada",
    story:["A partir dos anos 1880, a principal origem dos imigrantes passou a ser o sul e o leste da Europa: italianos, judeus fugindo dos pogroms no Império Russo, poloneses, gregos, húngaros e muitos outros. Em 1890, os imigrantes eram 14,8% da população. A partir de 1892, a maioria passou por Ellis Island, no porto de Nova York, onde cerca de 12 milhões de pessoas foram registradas até 1924; só cerca de 2% foram barradas.",
           "Imigrantes portugueses, sobretudo dos Açores, da Madeira e de Cabo Verde, se fixaram nas cidades baleeiras e fabris de Massachusetts e Rhode Island. Cresceu uma reação contra os imigrantes, e a Lei de Imigração de 1924 criou cotas por país que favoreciam o norte da Europa e quase fecharam a porta para europeus do sul e do leste e para asiáticos."],
    lname:"Ellis Island", ltext:"Os recém-chegados subiam até o Salão de Registro, onde médicos os observavam na escada em busca de sinais de doença. Estima-se que 40% dos americanos de hoje tenham pelo menos um antepassado que passou pela ilha.",
    facts:["A Estátua da Liberdade, presente da França inaugurado em 1886, traz o poema de Emma Lazarus: 'Dai-me os vossos cansados, os vossos pobres, as vossas massas amontoadas, ansiosas por respirar em liberdade'.",
           "Fall River, em Massachusetts, é quase metade luso-americana, a maior proporção de qualquer cidade dos EUA."]}

  en:{short:"Mexico and the Pacific", date:"1900 – 1965", title:"The southern border and the Pacific",
    story:["The Mexican Revolution of 1910–20 sent hundreds of thousands north. During the Second World War, the US and Mexico launched the Bracero Program to bring farm workers north; from 1942 to 1964 an estimated 4.5 million contracts were signed. Across the Pacific, Japanese, Filipino and Korean workers had come to the sugar plantations of Hawaii and the farms of California.",
           "In 1942, after the attack on Pearl Harbor, about 120,000 people of Japanese ancestry on the West Coast, most of them US citizens, were forced into incarceration camps such as Manzanar. In 1988 the US government formally apologized and paid reparations."],
    lname:"Los Angeles", ltext:"Los Angeles was founded in 1781 by settlers from Mexico, many of African and Indigenous descent. By the mid-20th century it had become the largest Mexican-American city in the country.",
    facts:["The 1924 quotas did not apply to the Americas, so Mexican immigration continued while European immigration was cut.",

  pt:{short:"México e Pacífico", date:"1900 – 1965", title:"A fronteira sul e o Pacífico",
    story:["A Revolução Mexicana de 1910–20 mandou centenas de milhares de pessoas para o norte. Durante a Segunda Guerra Mundial, os EUA e o México criaram o Programa Bracero para levar trabalhadores rurais ao norte; de 1942 a 1964, foram assinados cerca de 4,5 milhões de contratos. Do outro lado do Pacífico, trabalhadores japoneses, filipinos e coreanos tinham ido para as plantações de açúcar do Havaí e as fazendas da Califórnia.",
           "Em 1942, depois do ataque a Pearl Harbor, cerca de 120 mil pessoas de origem japonesa na Costa Oeste, a maioria cidadãos americanos, foram levadas à força para campos de internamento como Manzanar. Em 1988, o governo dos EUA pediu desculpas formalmente e pagou indenizações."],
    lname:"Los Angeles", ltext:"Los Angeles foi fundada em 1781 por colonos vindos do México, muitos de origem africana e indígena. Em meados do século XX, tornou-se a maior cidade mexicano-americana do país.",
    facts:["As cotas de 1924 não se aplicavam às Américas, por isso a imigração mexicana continuou enquanto a europeia era cortada.",
           "No Havaí, anexado em 1898, as pessoas de origem asiática são o maior grupo; muitas famílias descendem de trabalhadores das plantações."]}

  en:{short:"After 1965", date:"1965 – 2000", title:"The door reopens",
    story:["In 1970 immigrants were just 4.7% of the population, the lowest share ever recorded. The Immigration and Nationality Act of 1965 abolished the national-origin quotas and gave priority to family ties and skills. Arrivals from Asia and Latin America soon outnumbered those from Europe.",

  en:{short:"Kofun and Yamato", date:"c. 250 – 710", title:"Great tombs and newcomers",
    story:["From the 3rd century, powerful chiefs were buried in huge keyhole-shaped mounds, called kofun, surrounded by moats and clay figures. One clan, the Yamato, gradually gained control over much of the country and became the ancestors of the imperial family.",
           "Immigrants from the kingdoms of Korea and from China, known as toraijin, brought writing in Chinese characters, iron-working, silk weaving, new pottery and, in the 6th century, Buddhism. A 2021 study of ancient genomes found a third wave of East Asian ancestry in this period; modern Japanese people are genetically closest to the Kofun-era population."],
    lname:"Daisen Kofun", ltext:"The Daisen Kofun in Sakai, near Osaka, is one of the largest tombs in the world by area, about 486 metres long. It is part of the Mozu-Furuichi Kofun Group, a UNESCO World Heritage Site since 2019.",
    facts:["Many noble families of early Japan traced their ancestry to Korean or Chinese immigrants.",
           "Kofun mounds were decorated with clay figures called haniwa: soldiers, horses, houses and dancers."]},
  pt:{short:"Kofun e Yamato", date:"c. 250 – 710", title:"Grandes túmulos e recém-chegados",
    story:["A partir do século III, chefes poderosos eram enterrados em enormes montes em forma de buraco de fechadura, chamados kofun, cercados por fossos e figuras de barro. Um clã, o Yamato, aos poucos passou a controlar boa parte do país e deu origem à família imperial.",
           "Imigrantes dos reinos da Coreia e da China, chamados toraijin, trouxeram a escrita em caracteres chineses, o trabalho com ferro, a tecelagem da seda, uma nova cerâmica e, no século VI, o budismo. Um estudo de 2021 com genomas antigos encontrou uma terceira onda de ancestralidade do Leste Asiático nesse período; os japoneses de hoje são geneticamente mais próximos da população da época Kofun."],
    lname:"Daisen Kofun", ltext:"O Daisen Kofun, em Sakai, perto de Osaka, é um dos maiores túmulos do mundo em área, com cerca de 486 metros de comprimento. Faz parte do Grupo de Kofun de Mozu-Furuichi, Patrimônio Mundial da UNESCO desde 2019.",
    facts:["Muitas famílias nobres do Japão antigo diziam descender de imigrantes coreanos ou chineses.",
           "Os kofun eram decorados com figuras de barro chamadas haniwa: soldados, cavalos, casas e dançarinos."]}

  pt:{short:"Nara e Heian", date:"710 – 1185", title:"Aprendendo com a China Tang",
    story:["Em 710, a corte construiu uma capital permanente em Nara, com ruas em grade copiadas de Chang'an, a capital da China Tang. Missões oficiais navegavam até a China para trazer livros, leis, ensinamentos budistas e artes. Em 794, a capital se mudou para Heian-kyō, a atual Kyoto, onde ficou por mais de mil anos.",

    lname:"Nara", ltext:"No Tōdai-ji, em Nara, um Buda de bronze com cerca de 15 metros de altura foi consagrado em 752. Músicos, monges e convidados da China, da Coreia e até da Índia assistiram à cerimônia.",

  en:{short:"Samurai and Mongols", date:"1185 – 1543", title:"The divine winds",
    story:["In 1185 the warrior Minamoto clan defeated its rivals, and soon a shogun, a military ruler, governed from Kamakura while the emperor reigned in Kyoto. The samurai class would dominate Japan for almost seven centuries.",
           "Kublai Khan, the Mongol emperor of China, sent fleets with Korean and Chinese troops against Japan twice. In 1274 about 800–900 ships landed at Hakata Bay; in 1281 a much larger force of about 4,400 ships and 100,000 men returned. Both times storms wrecked the fleets. The Japanese called them kamikaze, 'divine winds'."],
    lname:"Hakata Bay", ltext:"After 1274 the Japanese built a stone wall about 19 km long along Hakata Bay, in today's Fukuoka. In 1281 it kept the invaders from landing for weeks, until the typhoon struck.",

           "Zen Buddhism and tea drinking spread among the samurai in this period, brought by monks returning from China."]},
  pt:{short:"Samurais e mongóis", date:"1185 – 1543", title:"Os ventos divinos",
    story:["Em 1185, o clã guerreiro Minamoto derrotou seus rivais, e logo um xogum, um governante militar, passou a governar a partir de Kamakura, enquanto o imperador reinava em Kyoto. A classe dos samurais dominaria o Japão por quase sete séculos.",
           "Kublai Khan, o imperador mongol da China, enviou duas vezes frotas com tropas coreanas e chinesas contra o Japão. Em 1274, cerca de 800 a 900 navios desembarcaram na baía de Hakata; em 1281, uma força muito maior, de cerca de 4.400 navios e 100 mil homens, voltou. Nas duas vezes, tempestades destruíram as frotas. Os japoneses as chamaram de kamikaze, 'ventos divinos'."],
    lname:"Baía de Hakata", ltext:"Depois de 1274, os japoneses construíram um muro de pedra de cerca de 19 km ao longo da baía de Hakata, na atual Fukuoka. Em 1281, ele impediu o desembarque dos invasores por semanas, até que o tufão chegou.",
    facts:["Mergulhadores encontraram restos da frota de 1281 perto de Takashima, incluindo um casco de navio e armas mongóis.",
           "O zen-budismo e o hábito de tomar chá se espalharam entre os samurais nesse período, trazidos por monges que voltavam da China."]}

  en:{short:"The Portuguese", date:"1543 – 1639", title:"The 'southern barbarians'",
    story:["In 1543 Portuguese traders on a Chinese junk landed on the island of Tanegashima, the first Europeans to reach Japan. They brought matchlock guns, which local smiths copied within a year; firearms soon changed Japan's wars. In 1549 the Jesuit Francis Xavier arrived in Kagoshima and began preaching Christianity.",
           "Portuguese 'black ships' sailed every year from Macau to Nagasaki, a port founded in 1571, carrying Chinese silk and silver. Japanese artists painted these namban, 'southern barbarians', on folding screens, and four young Japanese envoys reached Lisbon in 1584. But Japan's new rulers grew suspicious: missionaries were expelled from 1614, Christians were persecuted, and in 1639 Portuguese ships were banned."],
    lname:"Nagasaki", ltext:"Nagasaki grew from a fishing village into Japan's window on the world. In 1580 a local lord even handed the port to the Jesuits. Some 'hidden Christians' kept their faith in secret there for over two centuries.",
    facts:["Japanese words of Portuguese origin include tempura, kasutera (sponge cake, from 'pão de Castela') and konpeitō (from 'confeito').",
           "'Arigatō' does not come from 'obrigado'; it is a native Japanese word, and the resemblance is a coincidence."]},
  pt:{short:"Os portugueses", date:"1543 – 1639", title:"Os 'bárbaros do sul'",
    story:["Em 1543, comerciantes portugueses a bordo de um junco chinês desembarcaram na ilha de Tanegashima, os primeiros europeus a chegar ao Japão. Levavam arcabuzes, que os ferreiros locais copiaram em menos de um ano; as armas de fogo logo mudaram as guerras do Japão. Em 1549, o jesuíta Francisco Xavier chegou a Kagoshima e começou a pregar o cristianismo.",
           "As 'naus negras' portuguesas iam todos os anos de Macau a Nagasaki, porto fundado em 1571, levando seda chinesa e prata. Artistas japoneses pintaram esses namban, 'bárbaros do sul', em biombos, e quatro jovens embaixadores japoneses chegaram a Lisboa em 1584. Mas os novos governantes do Japão ficaram desconfiados: os missionários foram expulsos a partir de 1614, os cristãos foram perseguidos e, em 1639, os navios portugueses foram proibidos."],
    lname:"Nagasaki", ltext:"Nagasaki passou de aldeia de pescadores a janela do Japão para o mundo. Em 1580, um senhor local chegou a entregar o porto aos jesuítas. Alguns 'cristãos ocultos' mantiveram a fé em segredo ali por mais de dois séculos.",
    facts:["Palavras japonesas de origem portuguesa incluem tempura, kasutera (bolo, de 'pão de Castela') e konpeitō (de 'confeito').",
           "'Arigatō' não vem de 'obrigado'; é uma palavra japonesa nativa, e a semelhança é coincidência."]}

  en:{short:"Edo isolation", date:"1639 – 1853", title:"A closed country with small windows",
    story:["Under the Tokugawa shoguns, Japan lived through more than two centuries of peace. Japanese were forbidden to leave the country, and foreign contact was limited to a few channels: Dutch and Chinese merchants at Nagasaki, Korean embassies, the Ryukyu kingdom in the south and the Ainu in the north.",
           "The capital Edo grew into one of the largest cities in the world. In 1853 the American commodore Matthew Perry sailed into Edo Bay with steam-powered warships and demanded that Japan open its ports. Within a few years, treaties forced the country open."],
    lname:"Dejima", ltext:"Dejima was a small fan-shaped artificial island in Nagasaki harbour, about 120 by 75 metres. From 1641 it was the only place where Dutch traders could live, and the main gateway for European science, known in Japan as 'Dutch learning'.",
    facts:["The 'closed country' was never fully closed: books on medicine and astronomy kept arriving through Dejima.",
           "Japan's population stayed around 30 million for much of the Edo period."]},
  pt:{short:"Isolamento Edo", date:"1639 – 1853", title:"Um país fechado, com pequenas janelas",
    story:["Sob os xoguns Tokugawa, o Japão viveu mais de dois séculos de paz. Os japoneses eram proibidos de sair do país, e o contato com o exterior se limitava a alguns canais: mercadores holandeses e chineses em Nagasaki, embaixadas coreanas, o reino de Ryukyu ao sul e os ainus ao norte.",
           "A capital, Edo, se tornou uma das maiores cidades do mundo. Em 1853, o comodoro americano Matthew Perry entrou na baía de Edo com navios de guerra a vapor e exigiu que o Japão abrisse seus portos. Em poucos anos, tratados forçaram a abertura do país."],
    lname:"Dejima", ltext:"Dejima era uma pequena ilha artificial em forma de leque no porto de Nagasaki, com cerca de 120 por 75 metros. A partir de 1641, foi o único lugar onde os comerciantes holandeses podiam morar, e a principal porta de entrada da ciência europeia, conhecida no Japão como 'estudos holandeses'.",
    facts:["O 'país fechado' nunca foi totalmente fechado: livros de medicina e astronomia continuaram chegando por Dejima.",
           "A população do Japão ficou em torno de 30 milhões durante boa parte do período Edo."]}

  en:{short:"Meiji", date:"1868 – 1912", title:"Modernization and the colonization of Hokkaido",
    story:["In 1868 a new government restored power to the emperor Meiji and moved the capital to Edo, renamed Tokyo. Japan set out to catch up with the West: railways, factories, schools, a modern army. Foreign experts were hired, and Japanese students were sent abroad.",
           "The state also pushed into its edges. From 1869 settlers, many of them former samurai and poor farmers, were sent to colonize Hokkaido, the land of the Ainu, whose language and customs were suppressed. In 1879 the Ryukyu kingdom became Okinawa Prefecture. Only in 2019 did a Japanese law recognize the Ainu as an indigenous people."],
    lname:"Sapporo", ltext:"Sapporo was laid out on a grid in the 1870s with the help of American advisers. In 1869 the island's name was changed from Ezo to Hokkaido. Many place names there, including Sapporo itself, come from the Ainu language.",
    facts:["Japan's first railway, between Tokyo and Yokohama, opened in 1872.",
           "The Tomioka silk mill, built with French help in 1872, is now a UNESCO World Heritage Site."]},
  pt:{short:"Meiji", date:"1868 – 1912", title:"Modernização e colonização de Hokkaido",
    story:["Em 1868, um novo governo devolveu o poder ao imperador Meiji e mudou a capital para Edo, rebatizada de Tóquio. O Japão decidiu alcançar o Ocidente: ferrovias, fábricas, escolas, um exército moderno. Especialistas estrangeiros foram contratados, e estudantes japoneses foram mandados ao exterior.",
           "O Estado também avançou sobre suas bordas. A partir de 1869, colonos, muitos deles ex-samurais e camponeses pobres, foram enviados para colonizar Hokkaido, a terra dos ainus, cuja língua e costumes foram reprimidos. Em 1879, o reino de Ryukyu virou a província de Okinawa. Só em 2019 uma lei japonesa reconheceu os ainus como povo indígena."],
    lname:"Sapporo", ltext:"Sapporo foi traçada em grade nos anos 1870 com a ajuda de conselheiros americanos. Em 1869, o nome da ilha mudou de Ezo para Hokkaido. Muitos nomes de lugares ali, incluindo o próprio Sapporo, vêm da língua ainu.",
    facts:["A primeira ferrovia do Japão, entre Tóquio e Yokohama, foi inaugurada em 1872.",
           "A fábrica de seda de Tomioka, construída com ajuda francesa em 1872, hoje é Patrimônio Mundial da UNESCO."]}

  en:{short:"Emigration", date:"1885 – 1941", title:"From Kobe to Santos",
    story:["As Japan's countryside grew crowded and poor, the government encouraged emigration. From 1885, contract workers went to the sugar plantations of Hawaii, nearly 30,000 in the first decade, and later to California and Peru. When the United States restricted Japanese immigration in the 1900s and 1920s, Brazil became the main destination.",
           "On 18 June 1908 the ship Kasato Maru arrived at Santos with 781 people in 165 families, bound for São Paulo's coffee farms. Conditions were harsh, but more followed: about 164,000 arrived between 1917 and 1940, and with post-war arrivals nearly 200,000 in total. Today Brazil has the largest Japanese-descended community outside Japan, estimated at around two million people."],
    lname:"Santos", ltext:"18 June is Japanese Immigration Day in Brazil. Many of the first families later bought land, grew vegetables, tea and silk, and moved to São Paulo, where the Liberdade district became a Japanese neighbourhood.",
    facts:["The Kasato Maru's voyage from Kobe, around Africa, took 52 days.",
           "Japanese Brazilians introduced or spread crops such as persimmons, pepper and many vegetables in Brazil."]},
  pt:{short:"Emigração", date:"1885 – 1941", title:"De Kobe a Santos",
    story:["Com o campo japonês cada vez mais cheio e pobre, o governo incentivou a emigração. A partir de 1885, trabalhadores contratados foram para as plantações de açúcar do Havaí, quase 30 mil na primeira década, e depois para a Califórnia e o Peru. Quando os Estados Unidos restringiram a imigração japonesa nos anos 1900 e 1920, o Brasil se tornou o principal destino.",
           "Em 18 de junho de 1908, o navio Kasato Maru chegou a Santos com 781 pessoas em 165 famílias, rumo às fazendas de café de São Paulo. As condições eram duras, mas outros vieram: cerca de 164 mil chegaram entre 1917 e 1940 e, com as chegadas do pós-guerra, quase 200 mil no total. Hoje o Brasil tem a maior comunidade de descendentes de japoneses fora do Japão, estimada em cerca de dois milhões de pessoas."],
    lname:"Santos", ltext:"O dia 18 de junho é o Dia da Imigração Japonesa no Brasil. Muitas das primeiras famílias depois compraram terras, plantaram hortaliças, chá e seda e se mudaram para São Paulo, onde o bairro da Liberdade se tornou um bairro japonês.",
    facts:["A viagem do Kasato Maru de Kobe, contornando a África, durou 52 dias.",
           "Os nipo-brasileiros introduziram ou difundiram no Brasil culturas como o caqui, a pimenta-do-reino e muitas hortaliças."]}

/* projection that keeps longitudes beyond ±180 continuous (three world copies) */
const P = c => {
  if (c[0] > 180) { const q = proj([c[0]-360, c[1]]); return [q[0]+WORLD_W, q[1]]; }
  if (c[0] < -180) { const q = proj([c[0]+360, c[1]]); return [q[0]-WORLD_W, q[1]]; }
  return proj(c);
};
const S = p => T.apply(p);

function viewTransform(v){
  const p = P(v.c), k = W / (v.span/360*WORLD_W);
  return d3.zoomIdentity.translate(W/2 - p[0]*k, H/2 - p[1]*k).scale(k);
}
function flyTo(v, dur){
  svg.interrupt();
  if (dur) svg.transition().duration(dur).ease(d3.easeCubicInOut).call(zoom.transform, viewTransform(v));
  else svg.call(zoom.transform, viewTransform(v));
}
function eraTransform(i){
  const era = ERAS[i];
  if (!era.routes.length) return viewTransform(era.view);
  let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
  const add = p => { if (p[0]<x0) x0=p[0]; if (p[0]>x1) x1=p[0]; if (p[1]<y0) y0=p[1]; if (p[1]>y1) y1=p[1]; };
  era.routes.forEach(r => r.s.pts.forEach(add));
  era.places.forEach(pl => add(P(pl.c)));
  add(P(era.spot.c));
  const mob = W < 640;
  const ins = mob ? {t:66, r:62, b:24, l:22} : {t:100, r:124, b:78, l:48};
  const aw = Math.max(60, W - ins.l - ins.r), ah = Math.max(60, H - ins.t - ins.b);
  const bw = Math.max(x1 - x0, 1e-3), bh = Math.max(y1 - y0, 1e-3);
  let k = Math.min(aw / bw, ah / bh);
  k = Math.min(k, W / (7/360*WORLD_W));
  k = Math.max(k, W / 1800);
  const cx = ins.l + aw/2, cy = ins.t + ah/2;
  return d3.zoomIdentity.translate(cx - (x0+x1)/2*k, cy - (y0+y1)/2*k).scale(k);
}
function flyToEra(i, dur){
  svg.interrupt();
  const tr = eraTransform(i);
  if (dur) svg.transition().duration(dur).ease(d3.easeCubicInOut).call(zoom.transform, tr);

}
